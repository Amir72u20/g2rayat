          ctx.beginPath(); ctx.ellipse(cx, cy, r, r * (0.72 + j * 0.26), j * 3, 0, TAU); ctx.fill();
          ctx.fillStyle = 'rgba(228,202,160,' + (0.3 - row * 0.12).toFixed(2) + ')';   // sunlit facet
          ctx.beginPath(); ctx.ellipse(cx - r * 0.22, cy - r * 0.26, r * 0.54, r * 0.36, j * 3, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(58,42,24,0.5)'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.ellipse(cx, cy, r, r * (0.72 + j * 0.26), j * 3, 0, TAU); ctx.stroke();
        }
      }
    };
    if (this.viewL < M + 90) rim(M - 4, false, -1);
    if (this.viewR > S - M - 90) rim(S - M + 4, false, 1);
    if (this.viewT < M + 90) rim(M - 4, true, -1);
    if (this.viewB > S - M - 90) rim(S - M + 4, true, 1);
  },

  drawProps(ctx) {
    const P = World.props;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      if (!this.inView(p.x, p.y, p.r + 12)) continue;
      switch (p.kind) {
        case 0: {                                  // faceted boulder cluster
          for (let k = 0; k < p.rocks.length; k++) {
            const o = p.rocks[k], ox = p.x + o.dx, oy = p.y + o.dy, b = o.body, t = o.top;
            ctx.fillStyle = 'rgba(58,40,20,0.26)';
            ctx.beginPath(); ctx.ellipse(ox + o.r * 0.26, oy + o.r * 0.4, o.r * 1.05, o.r * 0.6, 0, 0, TAU); ctx.fill();
            ctx.fillStyle = 'rgb(' + ((150 + o.tone * 26) | 0) + ',' + ((120 + o.tone * 24) | 0) + ',' + ((88 + o.tone * 22) | 0) + ')';
            ctx.beginPath();
            ctx.moveTo(ox + b[0], oy + b[1]);
            for (let v = 2; v < b.length; v += 2) ctx.lineTo(ox + b[v], oy + b[v + 1]);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(84,60,36,0.6)'; ctx.lineWidth = 1.3; ctx.stroke();
            ctx.fillStyle = 'rgba(232,206,164,0.45)';          // sunlit top facet
            ctx.beginPath();
            ctx.moveTo(ox + t[0], oy + t[1]);
            for (let v = 2; v < t.length; v += 2) ctx.lineTo(ox + t[v], oy + t[v + 1]);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(96,70,44,0.35)'; ctx.lineWidth = 1;   // cracks
            ctx.beginPath();
            ctx.moveTo(ox + b[0] * 0.4, oy + b[1] * 0.4);
            ctx.lineTo(ox + b[4], oy + b[5]);
            ctx.stroke();
          }
          break;
        }
        case 1: {                                  // cracked dirt patch
          ctx.fillStyle = 'rgba(142,112,70,0.22)';
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.72, p.a, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(96,72,42,0.28)'; ctx.lineWidth = 1.3;
          ctx.beginPath();
          for (let k = 0; k < 4; k++) {
            const a = p.a + k * 1.57 + 0.3;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + Math.cos(a) * p.r * 0.92, p.y + Math.sin(a) * p.r * 0.66);
          }
          ctx.stroke();
          break;
        }
        case 2: {                                  // sun-bleached bones
          ctx.strokeStyle = 'rgba(42,30,16,0.22)'; ctx.lineCap = 'round';
          ctx.lineWidth = Math.max(2.4, p.r * 0.26);
          ctx.beginPath();
          ctx.moveTo(p.x - Math.cos(p.a) * p.r + 2, p.y - Math.sin(p.a) * p.r + 3);
          ctx.lineTo(p.x + Math.cos(p.a) * p.r + 2, p.y + Math.sin(p.a) * p.r + 3);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(238,228,204,0.92)';
          ctx.lineWidth = Math.max(2, p.r * 0.22);
          ctx.beginPath();
          ctx.moveTo(p.x - Math.cos(p.a) * p.r, p.y - Math.sin(p.a) * p.r);
          ctx.lineTo(p.x + Math.cos(p.a) * p.r, p.y + Math.sin(p.a) * p.r);
          ctx.stroke();
          ctx.fillStyle = 'rgba(244,236,214,0.95)';
          for (let k = -1; k <= 1; k += 2) {
            ctx.beginPath();
            ctx.arc(p.x + Math.cos(p.a) * p.r * k, p.y + Math.sin(p.a) * p.r * k, p.r * 0.2, 0, TAU);
            ctx.fill();
          }
          ctx.lineWidth = Math.max(1.4, p.r * 0.14);
          ctx.strokeStyle = 'rgba(232,222,196,0.8)';
          ctx.beginPath();
          ctx.moveTo(p.x - Math.cos(p.a + 1) * p.r * 0.6, p.y - Math.sin(p.a + 1) * p.r * 0.6);
          ctx.lineTo(p.x + Math.cos(p.a + 1) * p.r * 0.5, p.y + Math.sin(p.a + 1) * p.r * 0.5);
          ctx.stroke();
          break;
        }
        case 3: {                                  // scattered pebbles
          for (let k = 0; k < p.dots.length; k++) {
            const d = p.dots[k];
            ctx.fillStyle = 'rgba(58,40,20,0.2)';
            ctx.beginPath(); ctx.ellipse(p.x + d.dx + 1, p.y + d.dy + 1.4, d.r, d.r * 0.72, d.a, 0, TAU); ctx.fill();
            ctx.fillStyle = k % 3 === 0 ? '#b49274' : '#c2a583';
            ctx.beginPath(); ctx.ellipse(p.x + d.dx, p.y + d.dy, d.r, d.r * 0.72, d.a, 0, TAU); ctx.fill();
          }
          break;
        }
        default: {                                 // dry grass tuft
          ctx.lineCap = 'round';
          for (let k = 0; k < p.blades.length; k++) {
            const b = p.blades[k];
            ctx.strokeStyle = p.tone < 0.5 ? 'rgba(150,132,88,0.85)' : 'rgba(120,110,64,0.85)';
            ctx.lineWidth = b.w;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.quadraticCurveTo(
              p.x + Math.cos(b.a) * b.len * 0.6, p.y + Math.sin(b.a) * b.len * 0.6,
              p.x + Math.cos(b.a + b.curl) * b.len, p.y + Math.sin(b.a + b.curl) * b.len);
            ctx.stroke();
          }
        }
      }
    }
  },

  drawTrails(ctx) {
    const T = World.trails;
    ctx.lineCap = 'round';
    for (let i = 0; i < T.length; i++) {
      const t = T[i];
      if (!t.active || !this.inView(t.x, t.y, 40)) continue;
      const a = clamp(t.life / 6, 0, 1) * 0.20;
      ctx.strokeStyle = 'rgba(96,74,44,' + a.toFixed(3) + ')';
      ctx.lineWidth = t.w;
      ctx.beginPath();
      ctx.moveTo(t.x - Math.cos(t.a) * t.w, t.y - Math.sin(t.a) * t.w);
      ctx.lineTo(t.x + Math.cos(t.a) * t.w, t.y + Math.sin(t.a) * t.w);
      ctx.stroke();
    }
  },

  drawBurrows(ctx) {
    for (let i = 0; i < World.burrows.length; i++) {
      const b = World.burrows[i];
      if (!this.inView(b.x, b.y, 30)) continue;
      ctx.fillStyle = '#6b5535';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r + 6, b.r * 0.8 + 5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#14100a';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * 0.72, 0, 0, TAU); ctx.fill();
      if (b.occupant) {
        ctx.strokeStyle = 'rgba(180,220,150,0.55)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r + 8, b.r * 0.8 + 7, 0, 0, TAU); ctx.stroke();
      }
    }
  },

  // Food looks different depending on who is looking at it. To a snake it is
  // just grain and dry pips on the sand; to a mouse the same objects are ripe,
  // colourful and obviously worth the risk.
  drawSeeds(ctx) {
    const S = World.seeds;
    const hungry = Game.player && Game.player.kind === 'mouse';   // mouse vision
    const t = World.time;
    for (let i = 0; i < S.length; i++) {
      const s = S[i];
      if (!s.active || !this.inView(s.x, s.y, 14)) continue;
      if (!hungry) {                                  // --- snake's eyes: dull pips
        const r = s.inBush ? 3.4 : 2.8;
        ctx.fillStyle = s.inBush ? '#c3a874' : '#b39c6f';
        ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r * 0.7, s.g, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(92,70,36,0.45)';
        ctx.beginPath(); ctx.ellipse(s.x, s.y, r * 0.4, r * 0.2, s.g, 0, TAU); ctx.fill();
        continue;
      }
      const c = FOOD[s.type];
      const pulse = 0.88 + 0.12 * Math.sin(t * 2.6 + s.g * 3);
      const r = c.r * pulse * (s.inBush ? 1.12 : 1);
      ctx.fillStyle = c.glow;                         // appetising halo
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.3, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(40,26,10,0.22)';          // contact shadow
      ctx.beginPath(); ctx.ellipse(s.x + 1, s.y + 1.6, r, r * 0.8, s.g, 0, TAU); ctx.fill();
      if (s.type === 0) {                             // grain: a small golden ear
        ctx.fillStyle = c.main;
        ctx.beginPath(); ctx.ellipse(s.x, s.y, r * 1.25, r * 0.6, s.g, 0, TAU); ctx.fill();
        ctx.strokeStyle = c.dark; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s.x - Math.cos(s.g) * r, s.y - Math.sin(s.g) * r);
        ctx.lineTo(s.x + Math.cos(s.g) * r, s.y + Math.sin(s.g) * r); ctx.stroke();
      } else if (s.type === 2) {                      // pod: three little beads
        ctx.fillStyle = c.main;
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.arc(s.x + Math.cos(s.g) * k * r * 0.85, s.y + Math.sin(s.g) * k * r * 0.85, r * 0.58, 0, TAU);
          ctx.fill();
        }
      } else {                                        // berry / nut: round fruit
        ctx.fillStyle = c.main;
        ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.fill();
        ctx.fillStyle = c.dark;
        ctx.beginPath(); ctx.arc(s.x + r * 0.18, s.y + r * 0.22, r * 0.72, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.75)';       // wet highlight
      ctx.beginPath(); ctx.arc(s.x - r * 0.34, s.y - r * 0.38, r * 0.24, 0, TAU); ctx.fill();
    }
  },

  drawCorpses(ctx) {
    const C = World.corpses, t = World.time;
    for (let i = 0; i < C.length; i++) {
      const c = C[i];
      if (!c.active || !this.inView(c.x, c.y, 90)) continue;
      const a = clamp(c.life / 4, 0, 1);
      const r = 6 + Math.sqrt(c.mass) * 1.2;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(110,26,20,0.5)';
      ctx.beginPath(); ctx.ellipse(c.x, c.y, r * 1.7, r * 1.2, c.a, 0, TAU); ctx.fill();
      ctx.fillStyle = c.type === 1 ? '#6d5a34' : '#8a7256';
      ctx.beginPath(); ctx.ellipse(c.x, c.y, r, r * 0.62, c.a, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(235,225,200,0.75)'; ctx.lineWidth = 1.6;
      for (let k = 0; k < 3; k++) {
        const ang = c.a + k * 1.4;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + Math.cos(ang) * r * 1.3, c.y + Math.sin(ang) * r * 0.9);
        ctx.stroke();
      }
      // Circling vultures: a long-distance signal that something died here.
      ctx.fillStyle = 'rgba(20,16,10,0.55)';
      for (let k = 0; k < 3; k++) {
        const ang = t * 0.9 + k * 2.09;
        const vx = c.x + Math.cos(ang) * 46, vy = c.y + Math.sin(ang) * 30;
        ctx.beginPath();
        ctx.moveTo(vx - 7, vy);
        ctx.quadraticCurveTo(vx, vy - 5, vx + 7, vy);
        ctx.quadraticCurveTo(vx, vy + 2, vx - 7, vy);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  },

  drawWaves(ctx) {
    // Vibration rings — only meaningful (and only drawn) for a mouse player.
    const p = Game.player;
    if (!p || !p.alive || p.kind !== 'mouse') return;
    const W = World.waves;
    for (let i = 0; i < W.length; i++) {
      const w = W[i];
      if (!w.active) continue;
      if (dist2(w.x, w.y, p.x, p.y) > CONFIG.VIBRATION_RADIUS * CONFIG.VIBRATION_RADIUS) continue;
      ctx.strokeStyle = 'rgba(255,236,190,' + (0.30 * w.life * clamp(w.strong, 0.4, 1.6)).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
    }
  },

  drawParticles(ctx) {
    const P = World.particles;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      if (!p.active || !this.inView(p.x, p.y, 20)) continue;
      const a = clamp(p.life / p.max, 0, 1);
      if (p.kind === 0) ctx.fillStyle = 'rgba(214,186,132,' + (a * 0.8).toFixed(3) + ')';
      else if (p.kind === 1) ctx.fillStyle = 'rgba(86,120,60,' + (a * 0.85).toFixed(3) + ')';
      else if (p.kind === 2) ctx.fillStyle = 'rgba(150,26,20,' + (a * 0.85).toFixed(3) + ')';
      else if (p.kind === 3) ctx.fillStyle = 'rgba(150,240,190,' + (a * 0.9).toFixed(3) + ')';
      else ctx.fillStyle = 'rgba(220,200,170,' + (a * 0.8).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.7), 0, TAU); ctx.fill();
    }
    // Leaf-shake markers, visible from outside the bush.
    const Rs = World.rustles;
    for (let i = 0; i < Rs.length; i++) {
      const r = Rs[i];
      if (!r.active || !this.inView(r.x, r.y, 40)) continue;
      const a = clamp(r.life / 0.8, 0, 1);
      ctx.strokeStyle = 'rgba(226,244,190,' + (a * 0.55).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 10 + (1 - a) * 22, 0, TAU); ctx.stroke();
    }
  },

  drawBushes(ctx, day) {
    // Every tussock is drawn separately, sways on its own phase and shakes on
    // its own: a snake sliding through only moves the leaves it touches.
    const B = World.bushes, t = World.time;
    for (let i = 0; i < B.length; i++) {
      const b = B[i];
      if (!this.inView(b.x, b.y, b.r + 50)) continue;
      const P = b.patches;
      for (let k = 0; k < P.length; k++) {
        const p = P[k];
        const px = b.x + p.dx, py = b.y + p.dy;
        if (!this.inView(px, py, p.r + 26)) continue;
        const size = p.r * 2.4, spr = this.patchSprites[p.sp][p.sc][p.v];
        // Calm breeze is a small drift (cheap: a plain blit, no transform).
        const sway = Math.sin(t * 0.85 + p.ph) * p.r * 0.06 + Math.sin(t * 2.1 + p.ph * 2) * p.r * 0.025;
        if (p.shake > 0) {                       // something is pushing through it
          ctx.save();
          ctx.translate(px + sway, py + Math.sin(t * 25 + p.ph * 1.3) * p.shake * 2.6);
          ctx.rotate(Math.sin(t * 30 + p.ph) * p.shake * 0.4);
          ctx.drawImage(spr, -size / 2, -size / 2, size, size);
          ctx.restore();
        } else {
          ctx.drawImage(spr, px - size / 2 + sway, py - size / 2 + sway * 0.35, size, size);
        }
      }
    }
  },

  // Redraw the player on top of the leaves they are hiding in, so you can
  // still read your own body while being invisible to everyone else.
  drawPlayerOverBush(ctx, day) {
    const p = Game.player;
    if (!p || !p.alive || !p.inBush || p.burrow) return;
    this.overdraw = true;
    if (p.kind === 'snake') this.drawSnake(ctx, p, day); else this.drawMouse(ctx, p, day);
    this.overdraw = false;
  },

  drawHealLinks(ctx) {
    for (const m of Game.entities) {
      if (!m.alive || m.kind !== 'mouse' || m.venom <= 0) continue;
      if (!this.inView(m.x, m.y, CONFIG.HEAL_RADIUS + 40)) continue;
      const prog = clamp(m.healProg / CONFIG.HEAL_TIME, 0, 1);
      ctx.strokeStyle = m.healPartner ? 'rgba(140,240,190,0.5)' : 'rgba(160,220,255,0.18)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 10]);
      ctx.beginPath(); ctx.arc(m.x, m.y, CONFIG.HEAL_RADIUS, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      if (prog > 0) {
        ctx.strokeStyle = 'rgba(150,255,200,0.95)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(m.x, m.y, CONFIG.HEAL_RADIUS * 0.55, -Math.PI / 2, -Math.PI / 2 + TAU * prog); ctx.stroke();
      }
    }
  },

  drawEntities(ctx, day) {
    const E = Game.entities;
    for (let i = 0; i < E.length; i++) {
      const e = E[i];
      if (!e.alive || e.burrow) continue;
      if (!this.inView(e.x, e.y, e.kind === 'snake' ? e.r * 8 + 120 : e.r + 60)) continue;
      if (!e.isPlayer && e.inBush) {
        // Inside the grass you are invisible. Only speed betrays you — and even
        // then all anyone gets is a shadow between the shaking leaves.
        if ((e.speedNow || 0) < baseSpeed(e) * 0.45) continue;
        this.hidden = true;
      }
      if (e.kind === 'snake') this.drawSnake(ctx, e, day); else this.drawMouse(ctx, e, day);
      this.hidden = false;
    }
  },

  drawSnake(ctx, e, day) {
    const segs = e.segs, n = segs.length;
    const amp = e.waveAmp || 0;
    // Build the render path with the sinusoidal crawl wave applied.
    const pts = SNAKE_PTS;
    for (let i = 0; i < n; i++) {
      const s = segs[i];
      const prev = segs[Math.max(0, i - 1)], next = segs[Math.min(n - 1, i + 1)];
      let tx = next.x - prev.x, ty = next.y - prev.y;
      const d = Math.hypot(tx, ty) || 1;
      const nx = -ty / d, ny = tx / d;
      // Undulation is anchored at the head and strongest through the middle.
      const t = i / (n - 1);
      const k = Math.sin(e.wave - i * 0.40) * amp * Math.sin(Math.PI * Math.pow(t, 1.15));
      pts[i * 2] = s.x + nx * k;
      pts[i * 2 + 1] = s.y + ny * k;
    }
    const dim = e.ambush && !e.isPlayer ? 0 : 1;
    if (dim === 0) return;                           // an ambushing bot is invisible

    // Inside a bush a creature is only half-seen; the player gets a faint
    // silhouette redrawn over the leaves so they can still read their own body.
    const ghost = this.overdraw ? 0.72 : (this.hidden ? 0.26 : 1);
    ctx.globalAlpha = ghost * (e.immune > 0 ? 0.62 : 1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // Per-point body radius and normals: thick through the middle, fine tail.
    const nrm = SNAKE_NRM, rad = SNAKE_RAD;
    for (let i = 0; i < n; i++) {
      const px = pts[Math.max(0, i - 1) * 2], py = pts[Math.max(0, i - 1) * 2 + 1];
      const qx = pts[Math.min(n - 1, i + 1) * 2], qy = pts[Math.min(n - 1, i + 1) * 2 + 1];
      let tx = qx - px, ty = qy - py;
      const d = Math.hypot(tx, ty) || 1;
      nrm[i * 2] = -ty / d; nrm[i * 2 + 1] = tx / d;
      const t = i / (n - 1);
      // A bulge from a swallowed animal makes the body swell locally.
      let swell = 0;
      for (let k = 0; k < e.bulges.length; k++) {
        const b = e.bulges[k];
        const bi = b.t * (n - 1);
        const dd = Math.abs(i - bi);
        if (dd < 3) swell = Math.max(swell, b.size * 0.8 * (1 - dd / 3) * Math.sin(Math.PI * clamp(b.t * 1.05, 0, 1)));
      }
      const pop = 1 + 0.2 * (e.growPop || 0);                         // a visible "I just ate" swell
      rad[i] = ((t < 0.08 ? e.r * (0.80 + (t / 0.08) * 0.20)          // slim neck
                : t < 0.58 ? e.r                                       // full girth
                : e.r * (1 - Math.pow((t - 0.58) / 0.42, 1.45) * 0.88)) + swell) * pop;  // tapered tail
    }
    const outline = (scale, dx, dy) => {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const w = rad[i] * scale;
        const x = pts[i * 2] + nrm[i * 2] * w + dx, y = pts[i * 2 + 1] + nrm[i * 2 + 1] * w + dy;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (let i = n - 1; i >= 0; i--) {
        const w = rad[i] * scale;
        ctx.lineTo(pts[i * 2] - nrm[i * 2] * w + dx, pts[i * 2 + 1] - nrm[i * 2 + 1] * w + dy);
      }
      ctx.closePath();
    };

    const lit = 0.55 + 0.45 * day;
    ctx.fillStyle = 'rgba(20,14,6,0.28)';           // soft shadow on the sand
    outline(1, 5, 7); ctx.fill();

    ctx.fillStyle = e.isPlayer
      ? 'rgb(' + ((166 * lit) | 0) + ',' + ((134 * lit) | 0) + ',' + ((82 * lit) | 0) + ')'
      : 'rgb(' + ((138 * lit) | 0) + ',' + ((110 * lit) | 0) + ',' + ((68 * lit) | 0) + ')';
    outline(1, 0, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(48,36,16,' + (0.55 * lit).toFixed(3) + ')';
    ctx.lineWidth = 1.4; ctx.stroke();

    ctx.fillStyle = 'rgba(238,220,178,' + (0.26 * lit).toFixed(3) + ')';   // rounded top light
    outline(0.52, -1.6, -2.2); ctx.fill();

    // Dark saddle blotches running ACROSS the back with a thin pale edge, and
    // small flank spots between them — the markings of a desert sand viper.
    const pale = 'rgba(236,216,164,' + (0.30 * lit).toFixed(3) + ')';
    const dark = 'rgba(96,66,28,' + (0.78 * lit).toFixed(3) + ')';
    for (let i = 2; i < n - 1; i += 5) {
      const x = pts[i * 2], y = pts[i * 2 + 1];
      const a = Math.atan2(nrm[i * 2 + 1], nrm[i * 2]) + Math.PI / 2;   // body direction
      const wob = 0.82 + 0.3 * Math.sin(i * 1.7);                       // irregular saddles
      ctx.fillStyle = pale;                                            // pale edge of the blotch
      ctx.beginPath(); ctx.ellipse(x, y, rad[i] * 0.66 * wob, rad[i] * 0.86, a, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;                                            // the blotch itself
      ctx.beginPath(); ctx.ellipse(x, y, rad[i] * 0.5 * wob, rad[i] * 0.7, a, 0, TAU); ctx.fill();
    }
    if (e.r > 6.5) {                                 // flank spots between saddles
      ctx.fillStyle = 'rgba(96,70,34,' + (0.34 * lit).toFixed(3) + ')';
      for (let i = 4; i < n - 1; i += 4) {
        const x = pts[i * 2], y = pts[i * 2 + 1], nx = nrm[i * 2], ny = nrm[i * 2 + 1];
        const o = rad[i] * 0.64, sz = rad[i] * 0.2;
        ctx.beginPath(); ctx.ellipse(x + nx * o, y + ny * o, sz, sz * 0.85, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x - nx * o, y - ny * o, sz, sz * 0.85, 0, 0, TAU); ctx.fill();
      }
    }

    // --- Head ---
    const hx = pts[0], hy = pts[1], a = e.angle;
    const cos = Math.cos(a), sin = Math.sin(a);
    const hr = e.r * 1.26;
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(a);
    ctx.fillStyle = 'rgba(20,14,6,0.28)';
    ctx.beginPath(); ctx.ellipse(4, 6, hr * 1.25, hr * 0.9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = e.isPlayer ? 'rgb(' + ((170 * lit) | 0) + ',' + ((138 * lit) | 0) + ',' + ((86 * lit) | 0) + ')'
                               : 'rgb(' + ((142 * lit) | 0) + ',' + ((114 * lit) | 0) + ',' + ((72 * lit) | 0) + ')';
    ctx.beginPath();                                  // wedge-shaped viper head
    ctx.moveTo(hr * 1.75, 0);                         // snout
    ctx.quadraticCurveTo(hr * 0.85, -hr * 0.62, hr * 0.10, -hr * 0.95);   // wide jaw
    ctx.quadraticCurveTo(-hr * 0.70, -hr * 0.86, -hr * 1.05, -hr * 0.42); // narrowing neck
    ctx.lineTo(-hr * 1.05, hr * 0.42);
    ctx.quadraticCurveTo(-hr * 0.70, hr * 0.86, hr * 0.10, hr * 0.95);
    ctx.quadraticCurveTo(hr * 0.85, hr * 0.62, hr * 1.75, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(58,42,18,' + (0.5 * lit).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, hr * 0.11); ctx.stroke();               // crisp jaw line
    ctx.fillStyle = 'rgba(78,56,24,' + (0.3 * lit).toFixed(3) + ')';    // dark crown patch
    ctx.beginPath(); ctx.ellipse(-hr * 0.25, 0, hr * 0.6, hr * 0.42, 0, 0, TAU); ctx.fill();
    // Vertical-slit eyes.
    ctx.fillStyle = '#f2d46a';
    ctx.beginPath(); ctx.ellipse(hr * 0.5, -hr * 0.6, hr * 0.24, hr * 0.21, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hr * 0.5, hr * 0.6, hr * 0.24, hr * 0.21, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#160f05';
    ctx.beginPath(); ctx.ellipse(hr * 0.53, -hr * 0.6, hr * 0.07, hr * 0.17, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hr * 0.53, hr * 0.6, hr * 0.07, hr * 0.17, 0, 0, TAU); ctx.fill();
    // Forked tongue.
    if (e.tongueOut > 0) {
      const t = e.tongueOut / 0.45, L = hr * (0.55 + t * 0.75);
      ctx.strokeStyle = '#c8384c'; ctx.lineWidth = Math.max(1, hr * 0.10); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hr * 1.7, 0); ctx.lineTo(hr * 1.7 + L * 0.6, 0);
      ctx.moveTo(hr * 1.7 + L * 0.6, 0); ctx.lineTo(hr * 1.7 + L, -L * 0.42);
      ctx.moveTo(hr * 1.7 + L * 0.6, 0); ctx.lineTo(hr * 1.7 + L, L * 0.42);
      ctx.stroke();
    }
    ctx.restore();

    // Player-only feedback: ambush shimmer and charge ring.
    if (e.isPlayer) {
      if (e.ambush) {
        ctx.strokeStyle = 'rgba(160,230,255,' + (0.18 + 0.16 * e.coil).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(hx, hy, hr * 2.4 + e.coil * 10, 0, TAU); ctx.stroke();
      }
      if (e.charging && e.strikeCharge > 0.02) {
        ctx.strokeStyle = 'rgba(255,170,90,0.85)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(hx, hy, hr * 2.1, -Math.PI / 2, -Math.PI / 2 + TAU * e.strikeCharge); ctx.stroke();
      }
    }
    if (e.strikeT > 0) {                              // motion blur on the striking head
      ctx.strokeStyle = 'rgba(230,214,170,0.28)';
      ctx.lineWidth = e.r * 1.6;
      ctx.beginPath();
      ctx.moveTo(hx - cos * e.r * 4.4, hy - sin * e.r * 4.4);
      ctx.lineTo(hx, hy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  },

  drawMouse(ctx, e, day) {
    const lit = 0.55 + 0.45 * day;
    const hop = Math.sin(e.hop) * clamp((e.speedNow || 0) / 120, 0, 1);
    const r = e.r * (1 + 0.22 * (e.growPop || 0));   // pops bigger with every seed
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(e.angle);
    ctx.globalAlpha = (R.overdraw ? 0.72 : (R.hidden ? 0.26 : 1)) * (e.immune > 0 ? 0.62 : 1);

    ctx.fillStyle = 'rgba(20,14,6,0.28)';
    ctx.beginPath(); ctx.ellipse(2, 5, r * 1.25, r * 0.85, 0, 0, TAU); ctx.fill();

    // Tail: a long line that waves while running.
    ctx.strokeStyle = 'rgb(' + ((190 * lit) | 0) + ',' + ((150 * lit) | 0) + ',' + ((124 * lit) | 0) + ')';
    ctx.lineWidth = Math.max(1.4, r * 0.18); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 1.05, 0);
    ctx.quadraticCurveTo(-r * 2.0, Math.sin(e.tail) * r * 0.9, -r * 3.0, Math.sin(e.tail + 1.1) * r * 1.1);
    ctx.stroke();

    // Ears.
    ctx.fillStyle = 'rgb(' + ((150 * lit) | 0) + ',' + ((120 * lit) | 0) + ',' + ((98 * lit) | 0) + ')';
    ctx.beginPath(); ctx.ellipse(r * 0.45, -r * 0.85, r * 0.52, r * 0.46, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.45, r * 0.85, r * 0.52, r * 0.46, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(232,170,164,' + (0.85 * lit).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(r * 0.48, -r * 0.85, r * 0.28, r * 0.24, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.48, r * 0.85, r * 0.28, r * 0.24, 0, 0, TAU); ctx.fill();

    // Body: chest heaves faster when frightened.
    const breathe = 1 + Math.sin(World.time * (6 + e.fear * 12)) * (0.03 + e.fear * 0.05);
    const bodyR = (e.isPlayer ? 'rgb(' + ((196 * lit) | 0) + ',' + ((160 * lit) | 0) + ',' + ((116 * lit) | 0) + ')'
                              : 'rgb(' + ((172 * lit) | 0) + ',' + ((140 * lit) | 0) + ',' + ((104 * lit) | 0) + ')');
    ctx.fillStyle = bodyR;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.25 * breathe, r * 0.92 * breathe + hop * 0.8, 0, 0, TAU); ctx.fill();
    // Fur strokes.
    ctx.strokeStyle = 'rgba(110,84,56,' + (0.35 * lit).toFixed(3) + ')'; ctx.lineWidth = 1;
    for (let k = 0; k < 5; k++) {
      const ang = -0.8 + k * 0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * r * 0.3, Math.sin(ang) * r * 0.55);
      ctx.lineTo(Math.cos(ang) * r * 1.0, Math.sin(ang) * r * 0.85);
      ctx.stroke();
    }
    // Snout, eye, whiskers.
    ctx.fillStyle = 'rgb(' + ((206 * lit) | 0) + ',' + ((176 * lit) | 0) + ',' + ((140 * lit) | 0) + ')';
    ctx.beginPath(); ctx.ellipse(r * 1.05, 0, r * 0.52, r * 0.42, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e29a9a';
    ctx.beginPath(); ctx.arc(r * 1.5, 0, Math.max(1, r * 0.15), 0, TAU); ctx.fill();
    ctx.fillStyle = '#120c06';
    ctx.beginPath(); ctx.arc(r * 0.66, -r * 0.42, Math.max(1, r * 0.17), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.66, r * 0.42, Math.max(1, r * 0.17), 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(240,230,210,0.6)'; ctx.lineWidth = 0.9;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(r * 1.3, k * r * 0.12);
      ctx.lineTo(r * 2.1, k * r * 0.7 - r * 0.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r * 1.3, -k * r * 0.12);
      ctx.lineTo(r * 2.1, -k * r * 0.7 + r * 0.2);
      ctx.stroke();
    }
    ctx.restore();

    if (e.venom > 0) {                               // sick green pulse
      const k = clamp(e.venom / CONFIG.VENOM_DURATION, 0, 1);
      ctx.strokeStyle = 'rgba(120,230,120,' + (0.25 + 0.35 * Math.abs(Math.sin(World.time * 4))).toFixed(3) + ')';
      ctx.lineWidth = 2 + k * 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r * 1.9, 0, TAU); ctx.stroke();
    }
    if (e.flash > 0) {
      ctx.strokeStyle = 'rgba(170,255,210,' + e.flash.toFixed(3) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, r * (2 + (1 - e.flash) * 3), 0, TAU); ctx.stroke();
    }
    if (e.squeakMark > 0) {
      ctx.strokeStyle = 'rgba(255,190,120,' + (0.4 * e.squeakMark / 2).toFixed(3) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r * 2 + (2 - e.squeakMark) * 90, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  },

  drawNight(ctx, day) {
    const p = Game.player;
    const n = 1 - day;
    if (n > 0.02) {
      ctx.fillStyle = 'rgba(10,16,54,' + (0.48 * n).toFixed(3) + ')';
      ctx.fillRect(0, 0, this.w, this.h);
      // A mouse's world shrinks after dark.
      if (p && p.alive && p.kind === 'mouse') {
        const rad = (205 + 150 * day) * Camera.zoom;
        const g = ctx.createRadialGradient(this.w / 2, this.h / 2, rad * 0.3, this.w / 2, this.h / 2, rad * 1.5);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(3,5,16,' + (0.92 * n).toFixed(3) + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, this.w, this.h);
      }
      // Pit organ: the snake sees warm bodies glowing through the bushes.
      if (p && p.alive && p.kind === 'snake' && n > 0.3) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const o of Game.entities) {
          if (!o.alive || o.kind !== 'mouse' || o.burrow) continue;
          const d2 = dist2(o.x, o.y, p.x, p.y);
          if (d2 > CONFIG.PIT_ORGAN_RANGE * CONFIG.PIT_ORGAN_RANGE) continue;
          const sxp = (o.x - Camera.x) * Camera.zoom + this.w / 2;
          const syp = (o.y - Camera.y) * Camera.zoom + this.h / 2;
          const rr = (o.r * 3.4) * Camera.zoom;
          const g = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, rr);
          const a = clamp(1 - Math.sqrt(d2) / CONFIG.PIT_ORGAN_RANGE, 0, 1) * n;
          g.addColorStop(0, 'rgba(255,70,40,' + (0.55 * a).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255,40,20,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(sxp, syp, rr, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
    }
    // Venom haze: desaturated, blurred, closing in.
    if (p && p.alive && p.kind === 'mouse' && p.venom > 0) {
      const k = clamp(p.venom / CONFIG.VENOM_DURATION, 0, 1);
      ctx.fillStyle = 'rgba(70,120,70,' + (0.18 * k).toFixed(3) + ')';
      ctx.fillRect(0, 0, this.w, this.h);
      const g = ctx.createRadialGradient(this.w / 2, this.h / 2, Math.min(this.w, this.h) * (0.5 - 0.28 * k), this.w / 2, this.h / 2, Math.min(this.w, this.h) * 0.9);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(10,20,10,' + (0.75 * k).toFixed(3) + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, this.w, this.h);
    }
  }
};
// Food palette as a hungry mouse sees it.
const FOOD = [
  { r: 3.6, main: '#f0c24e', dark: '#b8862a', glow: 'rgba(240,194,78,0.16)' },   // grain
  { r: 4.0, main: '#e0484e', dark: '#a82b38', glow: 'rgba(224,72,78,0.18)' },    // berry
  { r: 3.4, main: '#8e6fd8', dark: '#5c44a0', glow: 'rgba(142,111,216,0.18)' },  // pod
  { r: 4.2, main: '#e08a3c', dark: '#a85c22', glow: 'rgba(224,138,60,0.16)' }    // nut
];
const SNAKE_PTS = new Float32Array(160);
const SNAKE_NRM = new Float32Array(160);
const SNAKE_RAD = new Float32Array(80);

/* ------------------------------ 12. HUD ----------------------------- */
R.bar = function (ctx, x, y, w, h, v, col, bg) {
  ctx.fillStyle = bg || 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  if (v > 0) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(x, y, Math.max(h, w * clamp(v, 0, 1)), h, h / 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,235,190,0.22)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, h / 2); ctx.stroke();
};

R.drawHUD = function (ctx) {
  const p = Game.player;
  const safeT = Input.safe.top, safeR = Input.safe.right, safeL = Input.safe.left, safeB = Input.safe.bottom;
  ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  ctx.textBaseline = 'middle';
  ctx.direction = 'rtl';

  // --- Minimap (top-right) ---
  const ms = Math.min(150, Math.max(104, this.w * 0.30));
  const mx = this.w - ms - 10 - safeR, my = 10 + safeT;
  if (!this.miniBase) this.buildMinimap();
  ctx.globalAlpha = 0.9;
  ctx.drawImage(this.miniBase, mx, my, ms, ms);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(232,201,138,0.5)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(mx + 0.5, my + 0.5, ms, ms);
  const k = ms / World.size;
  if (p && p.alive) {
    // Important markers only: envenomated prey (snake) or nearest healer (mouse).
    if (p.kind === 'snake' && p.prey && p.prey.alive) {
      const blink = (World.time * 4) % 1 > 0.4;
      if (blink) {
        ctx.fillStyle = '#7bf07b';
        ctx.beginPath(); ctx.arc(mx + p.prey.x * k, my + p.prey.y * k, 3.5, 0, TAU); ctx.fill();
      }
    }
    if (p.kind === 'mouse' && p.venom > 0) {
      const h = nearestHealthyMouse(p);
      if (h) { ctx.fillStyle = '#8ce8ff'; ctx.beginPath(); ctx.arc(mx + h.x * k, my + h.y * k, 3.5, 0, TAU); ctx.fill(); }
    }
    // Your own senses, drawn on the map: a mouse feels anything moving fast
    // nearby (even through a bush) and sees what is out in the open; a snake
    // sees warm bodies at night and whatever crosses the bare sand.
    const near = World.entGrid.query(p.x, p.y, 1500, tmpA);
    for (let i = 0; i < near.length; i++) {
      const o = near[i];
      if (o === p || !o.alive || o.burrow) continue;
      const d2 = dist2(p.x, p.y, o.x, o.y);
      const fast = (o.speedNow || 0) > baseSpeed(o) * 0.5;
      let sensed = false;
      if (p.kind === 'mouse') {
        sensed = (fast && d2 < CONFIG.VIBRATION_RADIUS * CONFIG.VIBRATION_RADIUS * 6.5)
              || (!o.inBush && !(o.kind === 'snake' && o.ambush) && d2 < 820 * 820);
      } else {
        sensed = (o.kind === 'mouse' && World.isNight() && d2 < CONFIG.PIT_ORGAN_RANGE * CONFIG.PIT_ORGAN_RANGE * 4)
              || (!o.inBush && d2 < 900 * 900) || (fast && d2 < 900 * 900);
      }
      if (!sensed) continue;
      ctx.fillStyle = o.kind === 'mouse' ? 'rgba(240,214,170,0.9)' : 'rgba(198,96,62,0.9)';
      ctx.beginPath(); ctx.arc(mx + o.x * k, my + o.y * k, o.kind === 'mouse' ? 2.4 : 3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#ffd86a';
    ctx.beginPath(); ctx.arc(mx + p.x * k, my + p.y * k, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // Day / night dial under the minimap.
  const day = World.dayFactor();
  ctx.font = '12px Tahoma, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(240,226,196,0.85)';
  ctx.fillText((day < 0.4 ? '🌙 شب' : (day < 0.75 ? '🌤 غروب/طلوع' : '☀ روز')) + ' · زنده: ' + fa(Game.aliveCount()),
    mx + ms, my + ms + 14);
  if (p) ctx.fillText('رتبه ' + fa(Game.rank(p)), mx + ms, my + ms + 32);

  if (!p || !p.alive) return;

  // --- Bars (top-left, under the small buttons) ---
  const bx = 12 + safeL, by = 58 + safeT, bw = Math.min(190, this.w * 0.42), bh = 11;
  ctx.textAlign = 'left';
  ctx.font = '12px Tahoma, sans-serif';
  this.bar(ctx, bx, by, bw, bh, clamp(p.mass / 120, 0.02, 1), '#e8c98a');
  ctx.fillStyle = '#f0e2c4';
  ctx.fillText('جرم ' + fa(Math.round(p.mass)), bx + bw + 8, by + bh / 2);
  this.bar(ctx, bx, by + 18, bw, bh, p.hp / p.maxHp, '#c9553f');
  ctx.fillStyle = '#f0e2c4';
  ctx.fillText('جان', bx + bw + 8, by + 18 + bh / 2);

  if (p.kind === 'snake') {
    this.bar(ctx, bx, by + 36, bw, bh, p.coil, p.coil >= 1 ? '#ffd05a' : '#6fc3e8');
    ctx.fillStyle = p.coil >= 1 ? '#ffd05a' : '#f0e2c4';
    ctx.fillText(p.ambush ? (p.coil >= 1 ? 'کمین — آماده!' : 'کمین…') : 'تنش', bx + bw + 8, by + 36 + bh / 2);
    this.bar(ctx, bx, by + 54, bw, bh, p.stamina, p.stamina >= CONFIG.STRIKE_STAMINA_COST ? '#b48ae8' : '#6b5a8a');
    ctx.fillStyle = '#d8c8f0';
    ctx.fillText('نفس', bx + bw + 8, by + 54 + bh / 2);
    if (p.digest > 0) { ctx.fillStyle = '#e8a05a'; ctx.fillText('در حال هضم…', bx, by + 76); }
    else if (p.cooldown > 0) { ctx.fillStyle = '#d08080'; ctx.fillText('ضربه خطا رفت!', bx, by + 76); }
  } else {
    if (p.venom > 0) {
      const left = clamp(1 - p.venom / CONFIG.VENOM_DURATION, 0, 1);
      this.bar(ctx, bx, by + 36, bw, bh, left, '#66d466');
      ctx.fillStyle = '#9cf09c';
      ctx.fillText('زهر · ' + fa(Math.ceil(CONFIG.VENOM_DURATION - p.venom)) + ' ثانیه', bx + bw + 8, by + 36 + bh / 2);
      if (p.healProg > 0) {
        this.bar(ctx, bx, by + 54, bw, bh, p.healProg / CONFIG.HEAL_TIME, '#7ee8c0');
        ctx.fillStyle = '#a8f0d8'; ctx.fillText('درمان', bx + bw + 8, by + 54 + bh / 2);
      }
    } else if (p.burrow) {
      this.bar(ctx, bx, by + 36, bw, bh, p.burrowT / CONFIG.BURROW_SAFE_TIME, '#9a8ae8');
      ctx.fillStyle = '#cfc4ff'; ctx.fillText('داخل سوراخ', bx + bw + 8, by + 36 + bh / 2);
    }
  }

  // --- Poisoned player: arrow pointing at the nearest healthy mouse ---
  if (p.kind === 'mouse' && p.venom > 0) {
    const h = nearestHealthyMouse(p);
    if (h) {
      const a = Math.atan2(h.y - p.y, h.x - p.x);
      const cx = this.w / 2, cy = this.h / 2, rr = Math.min(this.w, this.h) * 0.30;
      ctx.save();
      ctx.translate(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      ctx.rotate(a);
      ctx.fillStyle = 'rgba(140,232,255,0.9)';
      ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -9); ctx.lineTo(-10, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // --- Touch controls ---
  this.drawJoystick(ctx);
  this.drawButtons(ctx);
};

function nearestHealthyMouse(p) {
  let best = null, bd = 1e18;
  for (const o of Game.entities) {
    if (!o.alive || o.kind !== 'mouse' || o === p || o.venom > 0 || o.burrow) continue;
    const d2 = dist2(p.x, p.y, o.x, o.y);
    if (d2 < bd) { bd = d2; best = o; }
  }
  return best;
}

R.drawJoystick = function (ctx) {
  const j = Input.joy;
  if (!j.active) return;
  ctx.strokeStyle = 'rgba(240,226,196,0.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(j.ox, j.oy, j.radius, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(240,226,196,0.10)';
  ctx.beginPath(); ctx.arc(j.ox, j.oy, j.radius, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(240,226,196,0.55)';
  ctx.beginPath(); ctx.arc(j.kx, j.ky, 24, 0, TAU); ctx.fill();
};

R.drawButtons = function (ctx) {
  const B = Input.buttons;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < B.length; i++) {
    const b = B[i];
    const press = b.down ? 0.90 : 1;
    const r = b.r * press;
    ctx.globalAlpha = b.enabled ? 1 : 0.35;
    ctx.fillStyle = b.down ? 'rgba(232,201,138,0.55)' : 'rgba(30,22,12,0.55)';
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(232,201,138,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.stroke();
    if (b.ring > 0) {                        // charge ring around the strike button
      ctx.strokeStyle = 'rgba(255,170,90,0.95)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(b.x, b.y, r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * b.ring); ctx.stroke();
    }
    ctx.fillStyle = b.down ? '#20180d' : '#f0e2c4';
    ctx.font = 'bold ' + Math.round(r * 0.36) + 'px Tahoma, sans-serif';
    ctx.fillText(b.label, b.x, b.y);
    ctx.globalAlpha = 1;
  }
};

/* ----------------------------- 13. INPUT ---------------------------- */
const Input = {
  joy: { active: false, id: -1, ox: 0, oy: 0, kx: 0, ky: 0, radius: 62 },
  buttons: [],
  keys: {},
  safe: { top: 0, right: 0, bottom: 0, left: 0 },

  init() {
    this.readSafe();
    const c = R.canvas;
    const opts = { passive: false };
    c.addEventListener('pointerdown', e => this.down(e), opts);
    c.addEventListener('pointermove', e => this.move(e), opts);
    c.addEventListener('pointerup', e => this.up(e), opts);
    c.addEventListener('pointercancel', e => this.up(e), opts);
    c.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, opts);
    document.addEventListener('gesturestart', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if ([' ', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0 ||
          e.code === 'Space') e.preventDefault();
      if (e.code === 'KeyP') UI.togglePause();
      if (e.code === 'KeyM') UI.toggleMute();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => UI.autoPause());
    document.addEventListener('visibilitychange', () => { if (document.hidden) UI.autoPause(); });
  },
  readSafe() {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);' +
      'padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    this.safe.top = parseFloat(cs.paddingTop) || 0;
    this.safe.right = parseFloat(cs.paddingRight) || 0;
    this.safe.bottom = parseFloat(cs.paddingBottom) || 0;
    this.safe.left = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(probe);
  },

  // Buttons persist across frames (a held pointer keeps its identity) and are
  // rebuilt only when the player's role changes.
  layout() {
    const p = Game.player;
    const B = this.buttons;
    if (!p || !p.alive || Game.state !== 'playing') { B.length = 0; this.btnRole = null; return; }
    if (this.btnRole !== p.kind || B.length !== 2) {
      B.length = 0; this.btnRole = p.kind;
      if (p.kind === 'snake') {
        B.push({ id: 'strike', x: 0, y: 0, r: 46, label: 'ضربه', down: false, pid: -1, enabled: true, ring: 0 });
        B.push({ id: 'slow', x: 0, y: 0, r: 38, label: 'آهسته', down: false, pid: -1, enabled: true, ring: 0 });
      } else {
        B.push({ id: 'squeak', x: 0, y: 0, r: 46, label: 'جیغ', down: false, pid: -1, enabled: true, ring: 0 });
        B.push({ id: 'burrow', x: 0, y: 0, r: 38, label: 'سوراخ', down: false, pid: -1, enabled: true, ring: 0 });
      }
    }
    const bx = R.w - 76 - this.safe.right, by = R.h - 92 - this.safe.bottom;
    B[0].x = bx; B[0].y = by;
    B[1].x = bx - 104; B[1].y = by + 26;
    if (p.kind === 'snake') {
      B[0].enabled = canStrike(p);
      B[0].ring = p.charging ? p.strikeCharge : (p.cooldown > 0 ? 1 - p.cooldown / CONFIG.STRIKE_COOLDOWN : 0);
    } else {
      B[0].enabled = p.squeakCd <= 0;
      B[0].ring = p.squeakCd > 0 ? 1 - p.squeakCd / 3.5 : 0;
      const bur = nearestBurrow(p.x, p.y, 70);
      B[1].label = p.burrow ? 'بیرون' : 'سوراخ';
      B[1].enabled = !!bur || !!p.burrow;
      B[1].ring = p.burrow ? p.burrowT / CONFIG.BURROW_SAFE_TIME : 0;
    }
  },

  hitButton(x, y) {
    for (const b of this.buttons) {
      if (dist2(x, y, b.x, b.y) < (b.r + 12) * (b.r + 12)) return b;
    }
    return null;
  },

  down(ev) {
    ev.preventDefault();
    Sound.init(); Sound.resume();
    if (Game.state !== 'playing') return;
    const x = ev.clientX, y = ev.clientY;
    const b = this.hitButton(x, y);
    if (b) {
      b.down = true; b.pid = ev.pointerId;
      this.press(b, true);
      return;
    }
    if (x < R.w * 0.55 && !this.joy.active) {       // floating joystick, left half
      const j = this.joy;
      j.active = true; j.id = ev.pointerId;
      j.ox = x; j.oy = y; j.kx = x; j.ky = y;
    }
  },
  move(ev) {
    const j = this.joy;
    if (j.active && ev.pointerId === j.id) {
      ev.preventDefault();
      let dx = ev.clientX - j.ox, dy = ev.clientY - j.oy;
      const d = Math.hypot(dx, dy);
      if (d > j.radius) { dx *= j.radius / d; dy *= j.radius / d; }
      j.kx = j.ox + dx; j.ky = j.oy + dy;
    }
  },
  up(ev) {
    const j = this.joy;
    if (j.active && ev.pointerId === j.id) { j.active = false; j.id = -1; }
    for (const b of this.buttons) {
      if (b.down && b.pid === ev.pointerId) { b.down = false; this.press(b, false); }
    }
  },

  press(b, isDown) {
    const p = Game.player;
    if (!p || !p.alive) return;
    if (b.id === 'strike') {
      if (isDown) { if (canStrike(p)) { p.charging = true; vibrate(10); } else vibrate(4); }
      else if (p.charging) releaseStrike(p);        // hold = charge, release = launch
    } else if (b.id === 'squeak') {
      if (isDown && p.squeakCd <= 0) { squeak(p); vibrate(15); }
    } else if (b.id === 'burrow') {
      if (isDown) {
        if (p.burrow) leaveBurrow(p);
        else { const bu = nearestBurrow(p.x, p.y, 70); if (bu) { enterBurrow(p, bu); vibrate(15); } }
      }
    } else if (b.id === 'slow' && isDown) vibrate(8);
  },

  // Translate joystick + keyboard into throttle/heading. Release = full stop.
  apply(p) {
    if (!p || !p.alive) return;
    let ax = 0, ay = 0, mag = 0;
    const j = this.joy;
    if (j.active) {
      const dx = j.kx - j.ox, dy = j.ky - j.oy;
      const d = Math.hypot(dx, dy);
      if (d > 6) { ax = dx / d; ay = dy / d; mag = clamp((d - 6) / (j.radius - 6), 0, 1); }
    }
    let kx = 0, ky = 0;
    if (this.keys.KeyA || this.keys.ArrowLeft) kx -= 1;
    if (this.keys.KeyD || this.keys.ArrowRight) kx += 1;
    if (this.keys.KeyW || this.keys.ArrowUp) ky -= 1;
    if (this.keys.KeyS || this.keys.ArrowDown) ky += 1;
    if (kx || ky) {
      const d = Math.hypot(kx, ky);
      ax = kx / d; ay = ky / d;
      mag = (this.keys.ShiftLeft || this.keys.ShiftRight) ? 0.24 : 1;
    }
    const slowBtn = this.buttons.find(b => b.id === 'slow' && b.down);
    if (slowBtn) mag = Math.min(mag, 0.22);          // deliberate silent crawl

    if (mag > 0.001) { p.desired = Math.atan2(ay, ax); p.throttle = mag; }
    else p.throttle = 0;                             // let go and the creature simply stops

    // Keyboard actions (kept separate from the touch button, so holding one
    // never cancels the other).
    if (p.kind === 'snake') {
      const sp = !!this.keys.Space;
      if (sp && !p.charging && canStrike(p)) { p.charging = true; this.spaceCharge = true; }
      else if (!sp && this.spaceCharge) { this.spaceCharge = false; if (p.charging) releaseStrike(p); }
    } else {
      if (this.keys.Space && p.squeakCd <= 0) squeak(p);
      if (this.keys.KeyE && !this._eLatch) {
        this._eLatch = true;
        if (p.burrow) leaveBurrow(p);
        else { const bu = nearestBurrow(p.x, p.y, 70); if (bu) enterBurrow(p, bu); }
      }
      if (!this.keys.KeyE) this._eLatch = false;
    }
  }
};

/* ------------------------------- 14. UI ----------------------------- */
const $ = id => document.getElementById(id);
const UI = {
  spawnTimer: 0, toastT: 0, hintTimer: 0, hintStep: 0,

  init() {
    $('btnStart').onclick = () => { Sound.init(); Sound.resume(); this.hide('scrMenu'); Game.start(); };
    $('btnAgain').onclick = () => { this.hide('scrDead'); Game.entities = Game.entities.filter(e => e.alive); Game.spawnPlayer(); };
    $('btnResume').onclick = () => { this.hide('scrPause'); Game.state = 'playing'; Sound.resume(); };
    $('btnQuit').onclick = () => {
      this.hide('scrPause');
      if (Game.player && Game.player.alive) killEntity(Game.player, null, 'رها کردی');
      Game.state = 'dead'; this.showDeath();
    };
    $('btnPause').onclick = () => this.togglePause();
    $('btnMute').onclick = () => this.toggleMute();
  },
  show(id) { const el = $(id); el.style.display = 'flex'; el.classList.add('on'); },
  hide(id) { const el = $(id); el.classList.remove('on'); el.style.display = 'none'; },

  showSpawnCard(isSnake) {
    $('spawnRole').textContent = isSnake ? 'مار' : 'موش';
    $('spawnRole').className = 'big ' + (isSnake ? 'snakeC' : 'mouseC');
    $('spawnTxt').innerHTML = isSnake
      ? 'گرسنه‌ای. صبور باش.<br><span style="color:#9d8a6c">داخل بوته بایست و بی‌حرکت بمان تا نامرئی شوی.</span>'
      : 'همه می‌خواهند تو را بخورند. موفق باشی.<br><span style="color:#9d8a6c">دانه‌ها کنار بوته‌اند… و مارها هم همان‌جا.</span>';
    this.show('scrSpawn');
    Game.state = 'spawning';
    this.spawnTimer = 2.0;
  },
  showDeath() {
    const s = Game.lastStats || { mass: 0, kills: 0, time: 0, rank: 0, cause: '', kind: 'mouse' };
    $('deadTitle').textContent = s.kind === 'snake' ? 'مار مُرد' : 'موش مُرد';
    $('deadTxt').textContent = s.cause || 'پایان این جان.';
    $('stMass').textContent = fa(s.mass);
    $('stKills').textContent = fa(s.kills);
    $('stTime').textContent = fa(s.time) + ' ثانیه';
    $('stRank').textContent = fa(s.rank);
    this.show('scrDead');
  },
  togglePause() {
    if (Game.state === 'playing') { Game.state = 'paused'; this.show('scrPause'); }
    else if (Game.state === 'paused') { this.hide('scrPause'); Game.state = 'playing'; Sound.resume(); }
  },
  autoPause() { if (Game.state === 'playing') { Game.state = 'paused'; this.show('scrPause'); } },
  toggleMute() {
    Sound.init();
    Sound.setMuted(!Sound.muted);
    $('btnMute').textContent = Sound.muted ? '✕' : '♪';
  },
  toast(msg) {
    const el = $('toastTxt');
    el.textContent = msg; el.classList.add('on');
    this.toastT = 1.8;
  },
  setHint(msg) {
    const el = $('hintTxt');
    el.textContent = msg; el.classList.add('on');
    this.hintTimer = 5.5;
  },
  // Short, contextual coaching in the first 30 seconds — no tutorial menu.
  updateHints(dt) {
    if (this.toastT > 0 && (this.toastT -= dt) <= 0) $('toastTxt').classList.remove('on');
    if (this.hintTimer > 0 && (this.hintTimer -= dt) <= 0) $('hintTxt').classList.remove('on');
    const p = Game.player;
    if (!p || !p.alive || Game.runTime > 34) return;
    const t = Game.runTime;
    const snake = p.kind === 'snake';
    const steps = snake
      ? [[1.5, 'انگشتت را نیمه چپ صفحه بکش تا حرکت کنی. رها کنی، می‌ایستی.'],
         [9, 'برای کمین، داخل بوته بایست و بی‌حرکت بمان.'],
         [17, 'دکمه ضربه را نگه دار تا شارژ شود، بعد رها کن.'],
         [25, 'شکار بزرگ‌تر از خودت را زهر بزن و دنبالش برو.']]
      : [[1.5, 'انگشتت را نیمه چپ صفحه بکش. آهسته بروی، کسی نمی‌فهمد.'],
         [9, 'دانه‌های داخل بوته دو برابر ارزش دارند — و دو برابر خطر.'],
         [17, 'موج‌های روی زمین یعنی چیزی سریع حرکت کرد. مار بی‌حرکت را نمی‌بینی.'],
         [25, 'نیش خوردی؟ کنار یک موش سالم ۵ ثانیه بمان تا درمان شوی.']];
    if (this.hintStep < steps.length && t > steps[this.hintStep][0]) {
      this.setHint(steps[this.hintStep][1]);
      this.hintStep++;
    }
    if (t < 0.2) this.hintStep = 0;
  }
};

/* ---------------- 15. AMBIENT TENSION (heartbeat) ------------------- */
function updateTension(dt) {
  const p = Game.player;
  if (!p || !p.alive) return;
  let danger = 0;
  const near = World.entGrid.query(p.x, p.y, 420, tmpA);
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    if (o === p || !o.alive) continue;
    const d = Math.sqrt(dist2(p.x, p.y, o.x, o.y));
    if (p.kind === 'mouse' && o.kind === 'snake' && o.mass * CONFIG.VENOM_RATIO > p.mass)
      danger = Math.max(danger, clamp(1 - d / 420, 0, 1));
    if (p.kind === 'snake' && ((o.kind === 'mouse' && o.mass >= p.mass * CONFIG.VENOM_RATIO) ||
        (o.kind === 'snake' && o.mass >= p.mass * CONFIG.SNAKE_CATCH_RATIO)))
      danger = Math.max(danger, clamp(1 - d / 420, 0, 1));
  }
  if (p.kind === 'snake' && p.ambush) danger = Math.max(danger, 0.35 + p.coil * 0.3);
  if (p.kind === 'mouse' && p.venom > 0) danger = Math.max(danger, 0.55 + 0.45 * clamp(p.venom / CONFIG.VENOM_DURATION, 0, 1));
  if (danger > 0.18) Sound.heart(clamp(danger, 0, 1) * 0.9, danger > 0.6);
}

/* --------------------------- 16. GAME LOOP -------------------------- */
const FIXED = 1 / 60;
let acc = 0, last = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.25) dt = 0.25;                       // after a phone call / tab switch

  if (Game.state === 'spawning') {
    UI.spawnTimer -= dt;
    if (UI.spawnTimer <= 0) { UI.hide('scrSpawn'); Game.state = 'playing'; }
  }

  if (Game.state === 'playing' || Game.state === 'dead') {
    acc += dt;
    let steps = 0;
    while (acc >= FIXED && steps < 5) {            // fixed timestep: physics never drifts
      if (Game.state === 'playing') Input.apply(Game.player);
      Game.step(FIXED);
      acc -= FIXED;
      steps++;
    }
    if (steps === 5) acc = 0;
    updateTension(dt);
  }
  if (Game.state !== 'menu') {
    Input.layout();
    R.frame(acc / FIXED);
    R.autoTune(dt);
  }
}

/* ------------------------------ BOOTSTRAP --------------------------- */
(function boot() {
  R.init();
  Input.init();
  UI.init();
  // A first touch anywhere resumes the AudioContext (mobile autoplay policy).
  const kick = () => { Sound.init(); Sound.resume(); };
  window.addEventListener('pointerdown', kick, { once: false });
  window.addEventListener('keydown', kick, { once: false });
  requestAnimationFrame(loop);
})();
</script>
