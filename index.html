<script>
"use strict";
/* =====================================================================
   کویر: مار و موش  —  single-file survival arena
   Modules below (in order): Config, Utils/Noise, Audio, World, Grid,
   Entities, AI, Renderer, UI, Input, GameLoop.
   All balance numbers live in CONFIG — tweak there, nowhere else.
   ===================================================================== */

/* ----------------------------- 1. CONFIG ---------------------------- */
const CONFIG = {
  WORLD_SIZE: 4200,          // tighter arena = you actually meet other animals
  START_MASS: 10,
  // A mouse of equal mass is FASTER than a snake: the snake cannot win a chase,
  // it has to ambush. This is the core of the balance.
  SNAKE_BASE_SPEED: 148,      // px/s
  SNAKE_MIN_SPEED: 56,
  SNAKE_SPEED_EXP: 0.28,
  MOUSE_BASE_SPEED: 170,
  MOUSE_MIN_SPEED: 68,
  MOUSE_SPEED_EXP: 0.22,
  // Strike economy: one lunge covers ~0.7 s of running in 0.28 s, then 2.2 s of
  // crawling at 40% speed. Chaining strikes therefore averages ~0.6x normal
  // speed — deliberately SLOWER than simply slithering, so it can never be
  // used as a way to outrun a mouse.
  STRIKE_MULT: 2.6,
  STRIKE_DURATION: 0.28,
  STRIKE_COOLDOWN: 2.2,
  STRIKE_SLOW: 0.40,          // speed multiplier during the cooldown
  STRIKE_CHARGE_TIME: 0.55,   // hold time for a full-power strike
  STRIKE_STAMINA_COST: 0.5,   // stamina spent per lunge (bar refills slowly)
  STRIKE_STAMINA_REGEN: 0.17, // per second — two lunges, then you must wait
  AMBUSH_CHARGE_TIME: 2.5,
  AMBUSH_ENTER_TIME: 1.0,     // must stay still this long inside a bush
  AMBUSH_BONUS: 2.0,
  SWALLOW_RATIO: 1.0,         // r <= this  => instant swallow
  VENOM_RATIO: 2.5,           // r >= this  => the mouse may fight back
  VENOM_DURATION: 18,
  VENOM_SLOW_FLOOR: 0.30,
  HEAL_RADIUS: 120,
  HEAL_TIME: 5,
  HEALER_SLOW: 0.75,
  BURROW_SAFE_TIME: 8,
  BURROW_MAX_MASS: 55,        // a fat mouse simply does not fit (comedy + balance)
  DAY_NIGHT_CYCLE: 240,
  SEED_VALUE: 1.5,
  SEED_VALUE_IN_BUSH: 3.0,
  SEED_COUNT: 1500,
  SEED_RESPAWN_PER_SEC: 28,
  SEED_RING: 200,             // how far seeds spread around a bush
  CORPSE_MASS_RATIO: 0.6,
  CORPSE_LIFETIME: 20,
  BOT_COUNT: 130,
  SNAKE_BOT_SHARE: 0.40,      // mice outnumber snakes 1.5 to 1 — busy, but not a mouse farm
  TRAFFIC_RING: 1500,         // bots respawn in a ring this deep around the player
  RECYCLE_DIST: 2400,         // a bot that strays this far is moved back into play
  SPAWN_IMMUNITY: 3,
  DIGEST_BASE: 1.5,
  DIGEST_SLOW: 0.5,
  VIBRATION_RADIUS: 400,      // mouse "feels" fast movement inside this radius
  SNAKE_CATCH_RATIO: 1.8,     // snake must be this much heavier to eat a snake
  MELEE_DPS: 1.6,             // damage multiplier in mouse-vs-snake brawls
  HP_PER_MASS: 10,
  SQUEAK_RADIUS: 900,
  PIT_ORGAN_RANGE: 520        // snake heat vision at night
};

/* --------------------------- 2. UTILITIES --------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const pick = arr => arr[(Math.random() * arr.length) | 0];
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function angMove(a, b, maxStep) { const d = angDiff(a, b); return a + clamp(d, -maxStep, maxStep); }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
const FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function fa(n) { return String(n).replace(/\d/g, d => FA[+d]); }

// Cheap deterministic value-noise (wind, terrain). No allocations at runtime.
const NOISE_N = 256;
const noiseTab = new Float32Array(NOISE_N);
for (let i = 0; i < NOISE_N; i++) noiseTab[i] = Math.random();
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {                 // smooth value noise in [0,1]
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

/* ----------------------------- 3. AUDIO ----------------------------- */
// Every sound is synthesised with the Web Audio API — zero audio files.
const MASTER_VOL = 0.55;
const Sound = {
  ctx: null, master: null, muted: false, ready: false,
  windGain: null, nightGain: null, lastHeart: 0, last: {},

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const ctx = this.ctx;
    // Master chain: everything goes through a gentle low-pass and a
    // compressor, so no single effect can ever get shrill or spiky.
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : MASTER_VOL;
    const tame = ctx.createBiquadFilter();
    tame.type = 'lowpass'; tame.frequency.value = 3400; tame.Q.value = 0.5;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -26; comp.knee.value = 22; comp.ratio.value = 8;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    this.master.connect(tame); tame.connect(comp); comp.connect(ctx.destination);

    // Shared noise buffer (2 s of white noise) reused by every noisy effect.
    const len = ctx.sampleRate * 2;
    this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    // Continuous desert wind: looped noise through a slowly wobbling lowpass.
    const wind = ctx.createBufferSource(); wind.buffer = this.noiseBuf; wind.loop = true;
    const wf = ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 240; wf.Q.value = 0.6;
    this.windGain = ctx.createGain(); this.windGain.gain.value = 0.030;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 90;
    lfo.connect(lfoG); lfoG.connect(wf.frequency);
    wind.connect(wf); wf.connect(this.windGain); this.windGain.connect(this.master);
    wind.start(); lfo.start();

    // Night drone pad — faded in after dusk.
    this.nightGain = ctx.createGain(); this.nightGain.gain.value = 0;
    this.nightGain.connect(this.master);
    [55, 82.5, 110.3].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.10 / (i + 1);
      o.connect(g); g.connect(this.nightGain); o.start();
    });
    this.ready = true;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : MASTER_VOL; },
  // Rate limiter: each kind of sound may only fire so often, so a crowd of
  // creatures can never turn the arena into a wall of noise.
  gate(key, minGap) {
    const t = this.now();
    if (this.last[key] && t - this.last[key] < minGap) return false;
    this.last[key] = t;
    return true;
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  ok() { return this.ready && !this.muted && this.ctx && this.ctx.state === 'running'; },

  // Short filtered-noise burst: rustle, hiss, whoosh, sand.
  noise(vol, dur, type, f0, f1, q) {
    if (!this.ok() || vol < 0.006) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.5;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.16);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  tone(vol, dur, type, f0, f1, detune) {
    if (!this.ok() || vol < 0.006) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    if (detune) o.detune.value = detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  // Leaves: a short, soft, low brush — never the hissy static it used to be.
  rustle(v) {
    if (!this.gate('rustle', 0.42)) return;
    this.noise(0.045 * v, 0.26, 'lowpass', 900, 380, 0.7);
  },
  hiss(v) {
    if (!this.gate('hiss', 2.2)) return;
    this.noise(0.045 * v, 0.5, 'bandpass', 1700, 900, 0.8);
  },
  whoosh(v) {
    if (!this.gate('whoosh', 0.2)) return;
    this.noise(0.09 * v, 0.24, 'bandpass', 700, 1600, 1.1);
  },
  sand(v) { if (this.gate('sand', 0.3)) this.noise(0.05 * v, 0.3, 'lowpass', 900, 240, 1); },
  squeak(v) {                                  // a squeak, not a scream
    if (!this.gate('squeak', 0.32)) return;
    this.tone(0.085 * v, 0.20, 'triangle', 1050 + Math.random() * 260, 520);
    this.tone(0.035 * v, 0.14, 'sine', 1600, 900, 8);
  },
  gulp(v) { this.tone(0.13 * v, 0.28, 'sine', 165, 58); this.noise(0.05 * v, 0.2, 'lowpass', 520, 150, 1); },
  bite(v) {
    if (!this.gate('bite', 0.25)) return;
    this.noise(0.07 * v, 0.11, 'lowpass', 1100, 380, 1.2);
    this.tone(0.06 * v, 0.13, 'triangle', 130, 58);
  },
  heal(v) { this.tone(0.07 * v, 0.5, 'sine', 520, 1040); this.tone(0.05 * v, 0.6, 'triangle', 780, 1560); },
  heart(v, fast) {                             // two thumps, rate driven by danger
    const t = this.now();
    if (t - this.lastHeart < (fast ? 0.5 : 1.05)) return;
    this.lastHeart = t;
    this.tone(0.16 * v, 0.16, 'sine', 64, 32);
    setTimeout(() => this.tone(0.11 * v, 0.14, 'sine', 56, 28), fast ? 140 : 200);
  },
  setNight(n) { if (this.nightGain) this.nightGain.gain.value = 0.045 * n; }
};

/* -------------------- 4. SPATIAL HASH (never O(n^2)) ---------------- */
const CELL = 220;
class Grid {
  constructor(size) {
    this.cols = Math.ceil(size / CELL) + 1;
    this.cells = new Array(this.cols * this.cols);
    for (let i = 0; i < this.cells.length; i++) this.cells[i] = [];
  }
  clear() { for (let i = 0; i < this.cells.length; i++) if (this.cells[i].length) this.cells[i].length = 0; }
  idx(x, y) {
    const cx = clamp((x / CELL) | 0, 0, this.cols - 1);
    const cy = clamp((y / CELL) | 0, 0, this.cols - 1);
    return cy * this.cols + cx;
  }
  insert(o) { this.cells[this.idx(o.x, o.y)].push(o); }
  // Fills `out` with candidates inside the square around (x,y); returns out.
  query(x, y, r, out) {
    out.length = 0;
    const c0 = clamp(((x - r) / CELL) | 0, 0, this.cols - 1);
    const c1 = clamp(((x + r) / CELL) | 0, 0, this.cols - 1);
    const r0 = clamp(((y - r) / CELL) | 0, 0, this.cols - 1);
    const r1 = clamp(((y + r) / CELL) | 0, 0, this.cols - 1);
    for (let cy = r0; cy <= r1; cy++) {
      const base = cy * this.cols;
      for (let cx = c0; cx <= c1; cx++) {
        const cell = this.cells[base + cx];
        for (let i = 0; i < cell.length; i++) out.push(cell[i]);
      }
    }
    return out;
  }
}

/* ------------------------------ 5. WORLD ---------------------------- */
const World = {
  size: CONFIG.WORLD_SIZE,
  bushes: [], props: [], seeds: [], burrows: [], corpses: [],
  particles: [], trails: [], waves: [], rustles: [],
  bushGrid: null, seedGrid: null, entGrid: null, shaken: [],
  time: 0,            // seconds since world start (day/night clock)
  seedTimer: 0,

  generate() {
    const S = this.size;
    this.bushes.length = 0; this.props.length = 0; this.burrows.length = 0;
    this.corpses.length = 0;

    // --- Bushes: overlapping clusters make safe corridors and death traps ---
    const clusters = 46;
    for (let c = 0; c < clusters; c++) {
      const cx = rnd(420, S - 420), cy = rnd(420, S - 420);
      const n = rndInt(2, 5);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU, d = rnd(0, 340);
        const r = rnd(55, 150);
        const x = clamp(cx + Math.cos(a) * d, 260, S - 260);
        const y = clamp(cy + Math.sin(a) * d, 260, S - 260);
        this.bushes.push(this.makeBush(x, y, r));
      }
    }
    for (let i = 0; i < 40; i++) {  // lone shrubs scattered between the thickets
      this.bushes.push(this.makeBush(rnd(200, S - 200), rnd(200, S - 200), rnd(45, 110)));
    }

    // --- Static scenery: rock clusters, pebbles, dry tufts, bones, dirt ---
    for (let i = 0; i < 105; i++) this.props.push(this.makeRockCluster(rnd(60, S - 60), rnd(60, S - 60)));
    for (let i = 0; i < 160; i++) this.props.push(this.makePebbles(rnd(60, S - 60), rnd(60, S - 60)));
    for (let i = 0; i < 180; i++) this.props.push(this.makeTuft(rnd(60, S - 60), rnd(60, S - 60)));
    for (let i = 0; i < 65; i++)
      this.props.push({ kind: 2, x: rnd(60, S - 60), y: rnd(60, S - 60), r: rnd(10, 26), a: Math.random() * TAU });
    for (let i = 0; i < 85; i++)
      this.props.push({ kind: 1, x: rnd(60, S - 60), y: rnd(60, S - 60), r: rnd(30, 80), a: Math.random() * TAU });

    // --- Burrows: mouse-only shelters, never inside a bush ---
    let tries = 0;
    while (this.burrows.length < 60 && tries < 3000) {
      tries++;
      const x = rnd(140, S - 140), y = rnd(140, S - 140);
      if (this.bushAt(x, y)) continue;
      this.burrows.push({ x, y, r: 16, occupant: null });
    }

    // --- Seed pool (object pooling: allocated once, recycled forever) ---
    this.seeds.length = 0;
    for (let i = 0; i < CONFIG.SEED_COUNT; i++) this.seeds.push({ x: 0, y: 0, active: false, inBush: false, g: 0, type: 0 });
    for (let i = 0; i < CONFIG.SEED_COUNT; i++) this.spawnSeed();

    // --- Pools for transient effects (no allocation inside the game loop) ---
    this.particles.length = 0;
    for (let i = 0; i < 460; i++) this.particles.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, kind: 0, rot: 0 });
    this.trails.length = 0;
    for (let i = 0; i < 200; i++) this.trails.push({ active: false, x: 0, y: 0, a: 0, w: 6, life: 0 });
    this.waves.length = 0;
    for (let i = 0; i < 40; i++) this.waves.push({ active: false, x: 0, y: 0, r: 0, life: 0, strong: 0 });
    this.shaken.length = 0;
    this.rustles.length = 0;
    for (let i = 0; i < 40; i++) this.rustles.push({ active: false, x: 0, y: 0, life: 0 });
    this.corpses.length = 0;
    for (let i = 0; i < 60; i++) this.corpses.push({ active: false, x: 0, y: 0, mass: 0, life: 0, type: 0, a: 0 });

    // --- Spatial hashes ---
    this.bushGrid = new Grid(S); this.seedGrid = new Grid(S); this.entGrid = new Grid(S);
    for (const b of this.bushes) {  // a bush can span several cells: register footprint
      const c0 = clamp(((b.x - b.r) / CELL) | 0, 0, this.bushGrid.cols - 1);
      const c1 = clamp(((b.x + b.r) / CELL) | 0, 0, this.bushGrid.cols - 1);
      const r0 = clamp(((b.y - b.r) / CELL) | 0, 0, this.bushGrid.cols - 1);
      const r1 = clamp(((b.y + b.r) / CELL) | 0, 0, this.bushGrid.cols - 1);
      for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) this.bushGrid.cells[cy * this.bushGrid.cols + cx].push(b);

  // Two species share the desert: watered green shrubs and dry brown scrub.
  // Each bush just references a pre-rendered sprite, so drawing one costs a
  // single drawImage no matter how detailed it looks.
  // A bush is a CLUMP of small separate tussocks, not one big blob. Each
  // tussock sways on its own phase and rustles on its own, so a snake sliding
  // through only disturbs the leaves it actually touches.
  makeBush(x, y, r) {
    const species = Math.random() < 0.34 ? 0 : 1;     // 0 green, 1 dry
    const patches = [];
    const n = clamp(Math.round(r * r / 1900), 4, 14);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, d = Math.pow(Math.random(), 0.6) * r * 0.86;
      const pr = rnd(r * 0.30, r * 0.50);
      patches.push({
        dx: Math.cos(a) * d, dy: Math.sin(a) * d * 0.94, r: pr,
        // A clump is mostly one species with a few strays of the other mixed in.
        sp: Math.random() < 0.84 ? species : 1 - species,
        sc: pr < 30 ? 0 : 1,
        v: (Math.random() * 4) | 0,
        ph: Math.random() * TAU,
        shake: 0, act: false

    }
    return { x, y, r, species, patches, ph: Math.random() * TAU };
  },

  // A cluster of faceted boulders: outline and top facet baked once.
  makeRockCluster(x, y) {
    const n = rndInt(2, 6), rocks = [];
    let R = 0;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, d = rnd(0, 26 * n * 0.5);
      const rr = rnd(11, 34) * (i === 0 ? 1.25 : 1);
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d * 0.72;
      const v = rndInt(6, 9), body = [], top = [];
      const rot = Math.random() * TAU;
      for (let k = 0; k < v; k++) {
        const ang = rot + k / v * TAU;
        const rad = rr * rnd(0.78, 1.12);
        body.push(Math.cos(ang) * rad, Math.sin(ang) * rad * 0.82);
        top.push(Math.cos(ang) * rad * 0.56 - rr * 0.16, Math.sin(ang) * rad * 0.46 - rr * 0.2);
      }
      rocks.push({ dx, dy, r: rr, body, top, tone: Math.random() });
      R = Math.max(R, d + rr);
    }
    rocks.sort((a, b) => a.dy - b.dy);
    return { kind: 0, x, y, r: R + 8, rocks };
  },
  makePebbles(x, y) {
    const n = rndInt(5, 14), dots = [];
    let R = 0;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, d = Math.pow(Math.random(), 0.6) * rnd(20, 70);
      const rr = rnd(2, 5.5);
      dots.push({ dx: Math.cos(a) * d, dy: Math.sin(a) * d * 0.8, r: rr, a: Math.random() * TAU });
      R = Math.max(R, d + rr);
    }
    return { kind: 3, x, y, r: R + 4, dots };
  },
  makeTuft(x, y) {

      const a = rnd(-2.6, -0.5) + (Math.random() < 0.5 ? 0 : Math.PI);
      blades.push({ a, len: R * rnd(0.7, 1.5), curl: rnd(-0.5, 0.5), w: rnd(0.8, 1.7) });
    }
    return { kind: 4, x, y, r: R * 1.6, blades, tone: Math.random() };

  bushAt(x, y) {

    for (let i = 0; i < cells.length; i++) {
      const b = cells[i];
      if (dist2(x, y, b.x, b.y) < b.r * b.r) return b;
    }
    return null;
  },

  spawnSeed() {
    for (let i = 0; i < this.seeds.length; i++) {
      const s = this.seeds[i];
      if (s.active) continue;
      // Seeds grow only inside bushes and in a 150 px ring around them:
      // the mouse's food is exactly where the snake is hiding.
      const b = this.bushes[(Math.random() * this.bushes.length) | 0];
      const a = Math.random() * TAU;
      const d = Math.random() < 0.42 ? Math.random() * b.r * 0.9 : b.r + Math.random() * CONFIG.SEED_RING;
      s.x = clamp(b.x + Math.cos(a) * d, 20, this.size - 20);
      s.y = clamp(b.y + Math.sin(a) * d, 20, this.size - 20);
      s.inBush = d < b.r;
      s.g = Math.random() * TAU;
      // Food kind: 0 grain, 1 berry, 2 pod, 3 nut. Berries and pods grow in the
      // shade of a bush — the good stuff is always in the dangerous place.
      s.type = b.species === 0 && d < b.r * 1.3
        ? (Math.random() < 0.62 ? 1 : 2)                    // lush green bush: berries
        : (s.inBush ? (Math.random() < 0.45 ? 2 : 3) : (Math.random() < 0.66 ? 0 : 3));

    }

  },
  reindexSeeds() {

  },

  spawnCorpse(x, y, mass, type) {

      const c = this.corpses[i];
      if (c.active) continue;
      c.active = true; c.x = x; c.y = y; c.mass = mass * CONFIG.CORPSE_MASS_RATIO;
      c.life = CONFIG.CORPSE_LIFETIME; c.type = type; c.a = Math.random() * TAU;

    }
    return null;
  },
  particle(x, y, vx, vy, life, size, kind) {
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      if (p.active) continue;
      p.active = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
      p.life = life; p.max = life; p.size = size; p.kind = kind; p.rot = Math.random() * TAU;

    }

  },
  trail(x, y, a, w) {

    }
    return null;
  },
  wave(x, y, strong) {
    for (let i = 0; i < this.waves.length; i++) {
      const w = this.waves[i];
      if (w.active) continue;
      w.active = true; w.x = x; w.y = y; w.r = 10; w.life = 1; w.strong = strong;
      return w;
    }
    return null;
  },
  // Only the tussocks a creature actually brushes against start moving.
  shakePatch(p, amt) {
    p.shake = Math.min(1, p.shake + amt);
    if (!p.act) { p.act = true; this.shaken.push(p); }
  },
  shakeAt(b, x, y, amt) {
    const P = b.patches;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const rr = p.r + 30;
      if (dist2(x, y, b.x + p.dx, b.y + p.dy) < rr * rr) this.shakePatch(p, amt);
    }
  },

  rustle(x, y) {
    for (let i = 0; i < this.rustles.length; i++) {
      const r = this.rustles[i];
      if (r.active) continue;
      r.active = true; r.x = x; r.y = y; r.life = 0.8;
      return r;
    }
    return null;
  },

  // 0 = deep night, 1 = full day. Smooth dawn/dusk transitions.
  dayFactor() {
    const p = (this.time % CONFIG.DAY_NIGHT_CYCLE) / CONFIG.DAY_NIGHT_CYCLE;
    const s = Math.sin(p * TAU - Math.PI / 2) * 0.5 + 0.5;   // 0..1..0
    return clamp((s - 0.18) / 0.5, 0, 1);
  },
  isNight() { return this.dayFactor() < 0.4; },

  update(dt) {
    this.time += dt;
    // Seed respawn keeps the ecosystem fed at a balanced rate.
    this.seedTimer += dt * CONFIG.SEED_RESPAWN_PER_SEC;
    let made = false;
    while (this.seedTimer >= 1) { this.seedTimer -= 1; if (this.spawnSeed()) made = true; }
    if (made) this.reindexSeeds();

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      if (p.kind === 2) p.vy += 40 * dt;  // blood drops fall a little
    }
    for (let i = 0; i < this.trails.length; i++) { const t = this.trails[i]; if (t.active && (t.life -= dt) <= 0) t.active = false; }
    for (let i = 0; i < this.waves.length; i++) {
      const w = this.waves[i];
      if (!w.active) continue;
      w.life -= dt * 1.4; w.r += 230 * dt;
      if (w.life <= 0) w.active = false;
    }
    for (let i = 0; i < this.rustles.length; i++) { const r = this.rustles[i]; if (r.active && (r.life -= dt) <= 0) r.active = false; }
    for (let i = 0; i < this.corpses.length; i++) { const c = this.corpses[i]; if (c.active && (c.life -= dt) <= 0) c.active = false; }
    for (let i = this.shaken.length - 1; i >= 0; i--) {
      const p = this.shaken[i];
      p.shake -= dt * 1.5;
      if (p.shake <= 0) {
        p.shake = 0; p.act = false;
        this.shaken[i] = this.shaken[this.shaken.length - 1];
        this.shaken.pop();
      }
    }
  }
};
const tmpA = [], tmpB = [], tmpC = [];

/* ---------------------------- 6. ENTITIES --------------------------- */
let nextId = 1;

function snakeRadius(m) { return 3 + Math.sqrt(m) * 1.32; }
function mouseRadius(m) { return 4 + Math.sqrt(m) * 2.1; }

function makeSnake(x, y, mass, isPlayer) {
  const e = {
    id: nextId++, kind: 'snake', isPlayer: !!isPlayer, alive: true,
    x, y, angle: Math.random() * TAU, desired: 0, throttle: 0, mass,
    hp: mass * CONFIG.HP_PER_MASS, maxHp: mass * CONFIG.HP_PER_MASS,
    r: snakeRadius(mass), segs: [], bulges: [],
    wave: Math.random() * TAU, tongue: Math.random() * 1.5, tongueOut: 0,
    ambush: false, stillT: 0, coil: 0,
    strikeCharge: 0, charging: false, strikeT: 0, cooldown: 0, strikePower: 0, stamina: 1,
    digest: 0, immune: CONFIG.SPAWN_IMMUNITY, inBush: null, bushT: 0,
    kills: 0, maxMass: mass, born: 0, trailT: 0, hissT: rnd(5, 16), lastMeal: rnd(0, 12),
    state: 'WANDER', stateT: 0, wx: x, wy: y, prey: null, patience: rnd(3, 10),
    sloppy: Math.random() < 0.28,     // careless bots keep the world unpredictable
    tickOff: rndInt(0, 3), flash: 0
  };
  e.desired = e.angle;
  const n = snakeSegCount(mass);
  const sp0 = e.r * 0.82;
  for (let i = 0; i < n; i++) e.segs.push({ x: x - Math.cos(e.angle) * i * sp0, y: y - Math.sin(e.angle) * i * sp0 });
  return e;
}
function snakeSegCount(m) { return clamp(Math.round(15 + m * 0.85), 15, 76); }

function makeMouse(x, y, mass, isPlayer) {
  return {
    id: nextId++, kind: 'mouse', isPlayer: !!isPlayer, alive: true,
    x, y, angle: Math.random() * TAU, desired: 0, throttle: 0, mass,
    hp: mass * CONFIG.HP_PER_MASS, maxHp: mass * CONFIG.HP_PER_MASS,
    r: mouseRadius(mass),
    venom: 0, venomLayers: 0, healProg: 0, healBreak: 0, healing: false, helper: false,
    burrow: null, burrowT: 0, exitT: 0,
    squeakCd: 0, fear: 0, hop: Math.random() * TAU, tail: Math.random() * TAU,
    immune: CONFIG.SPAWN_IMMUNITY, inBush: null, kills: 0, maxMass: mass, born: 0,
    state: 'FORAGE', stateT: 0, wx: x, wy: y, target: null, ally: null,
    sloppy: Math.random() < 0.3, tickOff: rndInt(0, 3), flash: 0, seedsEaten: 0
  };
}

function baseSpeed(e) {
  if (e.kind === 'snake') {
    return Math.max(CONFIG.SNAKE_MIN_SPEED,
      CONFIG.SNAKE_BASE_SPEED * Math.pow(CONFIG.START_MASS / e.mass, CONFIG.SNAKE_SPEED_EXP));
  }
  return Math.max(CONFIG.MOUSE_MIN_SPEED,
    CONFIG.MOUSE_BASE_SPEED * Math.pow(CONFIG.START_MASS / e.mass, CONFIG.MOUSE_SPEED_EXP));
}
function turnRate(e) {
  if (e.kind === 'snake') {
    // Turning slows with size exactly like speed: a big snake cannot chase.
    return Math.max(1.05, 3.7 * Math.pow(CONFIG.START_MASS / e.mass, CONFIG.SNAKE_SPEED_EXP));
  }
  return Math.max(2.3, 6.6 * Math.pow(CONFIG.START_MASS / e.mass, CONFIG.MOUSE_SPEED_EXP));
}
function currentSpeed(e) {
  let s = baseSpeed(e);
  if (e.kind === 'snake') {
    if (e.strikeT > 0) s *= CONFIG.STRIKE_MULT * (0.72 + 0.28 * e.strikePower) * (e.strikeAmbush ? 1.25 : 1);
    else if (e.cooldown > 0) s *= CONFIG.STRIKE_SLOW;   // a missed strike really hurts
    if (e.digest > 0) s *= CONFIG.DIGEST_SLOW;
  } else {
    if (e.venom > 0) {
      const k = clamp(e.venom / CONFIG.VENOM_DURATION, 0, 1);
      s *= lerp(1, CONFIG.VENOM_SLOW_FLOOR, k);
    }
    if (e.helper) s *= CONFIG.HEALER_SLOW;       // helping is genuinely dangerous
    if (e.exitT > 0) s *= 0.35;
  }
  return s;
}

function setMass(e, m) {
  if (m > e.mass + 0.01) e.growPop = Math.min(1.2, (e.growPop || 0) + 0.55);
  e.mass = clamp(m, 2, 4000);
  e.maxHp = e.mass * CONFIG.HP_PER_MASS;
  if (e.hp > e.maxHp) e.hp = e.maxHp;
  e.maxMass = Math.max(e.maxMass, e.mass);
  if (e.kind === 'snake') {
    e.r = snakeRadius(e.mass);
    const want = snakeSegCount(e.mass);
    while (e.segs.length < want) {
      const last = e.segs[e.segs.length - 1];
      e.segs.push({ x: last.x, y: last.y });
    }
    while (e.segs.length > want) e.segs.pop();
  } else e.r = mouseRadius(e.mass);
}

/* Physics: fixed timestep, damped rotation, full stop when input is released. */
function moveEntity(e, dt) {
  const tr = turnRate(e) * (e.kind === 'snake' && e.strikeT > 0 ? 0.35 : 1);
  e.angle = angMove(e.angle, e.desired, tr * dt);

  let thr = clamp(e.throttle, 0, 1);
  if (e.kind === 'snake' && e.strikeT > 0) thr = 1;
  if (e.kind === 'mouse' && e.burrow) thr = 0;

  const sp = currentSpeed(e) * thr;
  if (sp > 0.01) {
    e.x += Math.cos(e.angle) * sp * dt;
    e.y += Math.sin(e.angle) * sp * dt;
  }
  const m = 34, S = World.size;
  if (e.x < m) { e.x = m; } if (e.x > S - m) { e.x = S - m; }
  if (e.y < m) { e.y = m; } if (e.y > S - m) { e.y = S - m; }
  e.speedNow = sp;
  e.inBush = World.bushAt(e.x, e.y);

  // Fast movement inside a bush shakes the leaves: visible + audible from outside.
  if (e.inBush && sp > baseSpeed(e) * 0.45) {
    World.shakeAt(e.inBush, e.x, e.y, dt * 4.5);      // only the leaves you touch
    if (Math.random() < dt * 2.2) {
      World.rustle(e.x + rnd(-14, 14), e.y + rnd(-14, 14));
      const d2c = dist2(e.x, e.y, Camera.x, Camera.y);
      if (d2c < 520 * 520) Sound.rustle(clamp(1 - Math.sqrt(d2c) / 520, 0, 1));
    }
  }
  // Anything moving fast sends a ground vibration a mouse can feel.
  if (sp > baseSpeed(e) * 0.5 && Math.random() < dt * 3.4) World.wave(e.x, e.y, sp / baseSpeed(e));
}

function updateSnakeBody(e, dt) {
  const segs = e.segs, spacing = e.r * 0.82;
  segs[0].x = e.x; segs[0].y = e.y;
  for (let i = 1; i < segs.length; i++) {
    const p = segs[i - 1], s = segs[i];
    let dx = s.x - p.x, dy = s.y - p.y;
    let d = Math.sqrt(dx * dx + dy * dy);
    if (d < 0.0001) { dx = -Math.cos(e.angle); dy = -Math.sin(e.angle); d = 1; }
    const k = spacing / d;
    s.x = p.x + dx * k; s.y = p.y + dy * k;
  }
  // Sinusoidal crawl wave — amplitude grows with speed, giving real slither.
  e.wave += dt * (2.6 + (e.speedNow || 0) / 28);
  e.waveAmp = lerp(e.waveAmp || 0, e.r * (0.55 + 1.75 * clamp((e.speedNow || 0) / baseSpeed(e), 0, 1.3)), dt * 5);

  // Sand drag marks left by the body, slowly fading.
  e.trailT -= dt;
  if (e.trailT <= 0 && (e.speedNow || 0) > 12) {
    e.trailT = 0.10;
    const t = segs[(segs.length * 0.7) | 0];
    World.trail(t.x, t.y, e.angle, e.r * 1.4);
  }
  // Digestion bulges travelling down the body.
  for (let i = e.bulges.length - 1; i >= 0; i--) {
    const b = e.bulges[i];
    b.t += dt / Math.max(1.2, b.dur);
    if (b.t >= 1) e.bulges.splice(i, 1);
  }
}

function updateSnake(e, dt) {
  e.immune = Math.max(0, e.immune - dt);
  e.growPop = Math.max(0, (e.growPop || 0) - dt * 2.2);
  e.lastMeal += dt;                                // the longer since a meal, the bolder
  e.digest = Math.max(0, e.digest - dt);
  e.cooldown = Math.max(0, e.cooldown - dt);
  // Lunge stamina refills slowly, so a snake cannot hop its way across the map.
  if (e.strikeT <= 0) e.stamina = Math.min(1, e.stamina + CONFIG.STRIKE_STAMINA_REGEN * dt);
  e.flash = Math.max(0, e.flash - dt * 2);
  if (e.strikeT > 0) {
    e.strikeT -= dt;
    if (Math.random() < dt * 30) World.particle(e.x + rnd(-6, 6), e.y + rnd(-6, 6), rnd(-40, 40), rnd(-40, 40), 0.45, rnd(1.5, 3.4), 0);
    if (e.strikeT <= 0) { e.cooldown = CONFIG.STRIKE_COOLDOWN; e.strikeAmbush = false; }
  }
  // Forked tongue flicks out about every 1.5 s.
  e.tongue -= dt;
  if (e.tongue <= 0) { e.tongue = rnd(1.2, 1.9); e.tongueOut = 0.45; }
  e.tongueOut = Math.max(0, e.tongueOut - dt);

  // --- Ambush: inside a bush + practically motionless => invisible predator ---
  const still = e.throttle < 0.06 && e.strikeT <= 0;
  if (still && e.inBush) {
    e.stillT += dt;
    if (e.stillT >= CONFIG.AMBUSH_ENTER_TIME) {
      if (!e.ambush && e.isPlayer) Sound.hiss(0.5);
      e.ambush = true;
      e.coil = clamp(e.coil + dt / CONFIG.AMBUSH_CHARGE_TIME, 0, 1);
    }
  } else {
    e.stillT = 0;
    if (e.ambush) { e.ambush = false; }
    e.coil = Math.max(0, e.coil - dt * 0.8);      // tension drains once you move
  }
  if (e.charging) e.strikeCharge = clamp(e.strikeCharge + dt / CONFIG.STRIKE_CHARGE_TIME, 0, 1);

  e.hissT -= dt;
  if (e.hissT <= 0) {
    e.hissT = rnd(9, 20);
    const d = Math.sqrt(dist2(e.x, e.y, Camera.x, Camera.y));
    if (d < 440) Sound.hiss(clamp(1 - d / 440, 0, 1));
  }
  moveEntity(e, dt);
  updateSnakeBody(e, dt);
  setMass(e, e.mass);
}

function canStrike(e) {
  return e.cooldown <= 0 && e.strikeT <= 0 && e.digest <= 0 && e.stamina >= CONFIG.STRIKE_STAMINA_COST;
}
function releaseStrike(e) {
  if (!canStrike(e)) {
    e.charging = false; e.strikeCharge = 0;
    if (e.isPlayer && e.stamina < CONFIG.STRIKE_STAMINA_COST) UI.toast('نفس کم آورده‌ای — صبر کن');
    return false;
  }
  e.stamina -= CONFIG.STRIKE_STAMINA_COST;
  const power = Math.max(0.25, e.strikeCharge);
  e.strikePower = power;
  e.strikeAmbush = e.coil >= 0.999 || (e.ambush && e.coil > 0.6);
  // Patience pays: a fully coiled ambush strike reaches twice as far, twice as fast.
  e.strikeT = CONFIG.STRIKE_DURATION * (e.strikeAmbush ? CONFIG.AMBUSH_BONUS : 1) * (0.6 + 0.4 * power);
  e.charging = false; e.strikeCharge = 0;
  e.coil = 0; e.ambush = false; e.stillT = 0;
  const d = Math.sqrt(dist2(e.x, e.y, Camera.x, Camera.y));
  if (d < 900) Sound.whoosh(clamp(1 - d / 900, 0, 1));
  for (let i = 0; i < 8; i++) World.particle(e.x, e.y, rnd(-90, 90), rnd(-90, 90), 0.5, rnd(2, 4), 0);
  if (e.isPlayer) vibrate(18);
  return true;
}

function updateMouse(e, dt) {
  e.immune = Math.max(0, e.immune - dt);
  e.growPop = Math.max(0, (e.growPop || 0) - dt * 2.2);
  e.squeakCd = Math.max(0, e.squeakCd - dt);
  e.exitT = Math.max(0, e.exitT - dt);
  e.flash = Math.max(0, e.flash - dt * 2);
  e.hop += dt * (4 + (e.speedNow || 0) / 16);
  e.tail += dt * (3 + (e.speedNow || 0) / 22);
  e.fear = Math.max(0, e.fear - dt * 0.5);

  if (e.burrow) {                                  // safe underground, but starving
    e.burrowT -= dt;
    e.x = e.burrow.x; e.y = e.burrow.y;
    if (e.burrowT <= 0) leaveBurrow(e);
  }
  if (e.venom > 0) {
    e.venom += dt * (1 + 0.35 * Math.max(0, e.venomLayers - 1));
    if (e.venom >= CONFIG.VENOM_DURATION) { killEntity(e, null, 'زهر'); return; }
  }
  e.helper = false;                                // recomputed every step by healing logic
  moveEntity(e, dt);
  setMass(e, e.mass);
}

function enterBurrow(e, b) {
  if (e.mass > CONFIG.BURROW_MAX_MASS) { if (e.isPlayer) toast('خیلی چاق شده‌ای! داخل سوراخ جا نمی‌شوی'); return false; }
  if (b.occupant && b.occupant !== e) return false;
  b.occupant = e; e.burrow = b; e.burrowT = CONFIG.BURROW_SAFE_TIME;
  e.x = b.x; e.y = b.y;
  Sound.sand(0.5);
  return true;
}
function leaveBurrow(e) {
  if (!e.burrow) return;
  e.burrow.occupant = null; e.burrow = null;
  e.exitT = 0.5;                                   // 0.5 s of vulnerable climb-out
  Sound.sand(0.4);
}

/* --------------------- Interactions & killing ----------------------- */
function killEntity(e, by, cause) {
  if (!e.alive) return;
  e.alive = false;
  e.deathCause = cause || '';
  World.spawnCorpse(e.x, e.y, e.mass, e.kind === 'snake' ? 1 : 0);
  const d = Math.sqrt(dist2(e.x, e.y, Camera.x, Camera.y));
  const v = clamp(1 - d / 1100, 0, 1);
  if (e.kind === 'mouse') Sound.squeak(v); else Sound.hiss(v);
  for (let i = 0; i < 14; i++)
    World.particle(e.x, e.y, rnd(-120, 120), rnd(-120, 120), rnd(0.5, 1.1), rnd(2, 5), 2);
  if (by) by.kills++;
  if (e.isPlayer) Game.onPlayerDeath(cause);
}

function swallow(snake, mouse) {
  setMass(snake, snake.mass + mouse.mass * 0.85);
  snake.bulges.push({ t: 0, dur: CONFIG.DIGEST_BASE + mouse.mass / 8, size: mouse.r });
  snake.digest = CONFIG.DIGEST_BASE + mouse.mass / 8;   // greedy back-to-back hunting = suicide
  snake.lastMeal = 0;
  snake.kills++;
  mouse.alive = false;
  if (mouse.burrow) { mouse.burrow.occupant = null; mouse.burrow = null; }
  const d = Math.sqrt(dist2(snake.x, snake.y, Camera.x, Camera.y));
  const v = clamp(1 - d / 1000, 0, 1);
  Sound.squeak(v * 0.9); Sound.gulp(v);
  for (let i = 0; i < 10; i++) World.particle(mouse.x, mouse.y, rnd(-70, 70), rnd(-70, 70), 0.7, rnd(2, 4), 2);
  if (mouse.isPlayer) Game.onPlayerDeath('بلعیده شدی');
  if (snake.isPlayer) { vibrate(45); Game.flashMsg('بلعیدی!'); }
  snake.tongueOut = 0.6;
}

function envenomate(snake, mouse) {
  if (mouse.venom <= 0) mouse.venom = 0.01;
  mouse.venomLayers++;
  mouse.fear = 1;
  mouse.hp -= mouse.maxHp * 0.12;
  snake.prey = mouse;                        // the snake now tracks it on the minimap
  snake.cooldown = Math.max(snake.cooldown, 0.35);
  const kb = 120;
  mouse.x += Math.cos(snake.angle) * kb * 0.12;
  mouse.y += Math.sin(snake.angle) * kb * 0.12;
  const d = Math.sqrt(dist2(mouse.x, mouse.y, Camera.x, Camera.y));
  const v = clamp(1 - d / 1000, 0, 1);
  Sound.bite(v); Sound.squeak(v);
  for (let i = 0; i < 8; i++) World.particle(mouse.x, mouse.y, rnd(-80, 80), rnd(-80, 80), 0.6, rnd(1.5, 3), 2);
  if (mouse.isPlayer) { vibrate([30, 40, 30]); Game.flashMsg('زهر! دنبال یک موش سالم بگرد'); }
  if (snake.isPlayer) { vibrate(25); Game.flashMsg('زهرزنی — ردش را بگیر'); }
}

// Snake head touches a mouse: the mass ratio decides everything.
function snakeBite(snake, mouse) {
  if (!snake.alive || !mouse.alive || mouse.immune > 0 || snake.immune > 0 || mouse.burrow) return;
  const r = mouse.mass / snake.mass;
  if (r <= CONFIG.SWALLOW_RATIO) swallow(snake, mouse);
  else if (r < CONFIG.VENOM_RATIO) envenomate(snake, mouse);
  else {
    // Too big to handle: this is a brawl, and every bite still injects venom.
    if (mouse.venom <= 0) mouse.venom = 0.01;
    if (snake.biteCd === undefined || snake.biteCd <= 0) {
      mouse.venomLayers++; snake.biteCd = 0.9;
      mouse.hp -= mouse.maxHp * 0.05;
      Sound.bite(clamp(1 - Math.sqrt(dist2(mouse.x, mouse.y, Camera.x, Camera.y)) / 1000, 0, 1));
    }
  }
}

function eatCorpse(snake, c) {
  setMass(snake, snake.mass + c.mass);
  snake.digest = CONFIG.DIGEST_BASE + c.mass / 10;
  snake.lastMeal = 0;
  snake.bulges.push({ t: 0, dur: snake.digest, size: Math.sqrt(c.mass) * 1.2 });
  c.active = false;
  Sound.gulp(clamp(1 - Math.sqrt(dist2(c.x, c.y, Camera.x, Camera.y)) / 900, 0, 1));
  if (snake.isPlayer) { vibrate(30); Game.flashMsg('لاشه خورده شد'); }
}

function eatSnake(big, small) {
  setMass(big, big.mass + small.mass * 0.75);
  big.digest = CONFIG.DIGEST_BASE + small.mass / 7;
  big.lastMeal = 0;
  big.bulges.push({ t: 0, dur: big.digest, size: small.r });
  big.kills++;
  small.alive = false;
  Sound.gulp(clamp(1 - Math.sqrt(dist2(small.x, small.y, Camera.x, Camera.y)) / 1000, 0, 1));
  for (let i = 0; i < 12; i++) World.particle(small.x, small.y, rnd(-90, 90), rnd(-90, 90), 0.7, rnd(2, 4), 2);
  if (small.isPlayer) Game.onPlayerDeath('یک مار بزرگ‌تر تو را گرفت');
  if (big.isPlayer) { vibrate(60); Game.flashMsg('مارخواری!'); }
}

function squeak(e) {
  if (e.squeakCd > 0) return;
  e.squeakCd = 3.5;
  Sound.squeak(clamp(1 - Math.sqrt(dist2(e.x, e.y, Camera.x, Camera.y)) / 1200, 0, 1) * 1.2);
  World.wave(e.x, e.y, 2.2);
  e.squeakMark = 2.0;          // pure risk/reward: allies hear you — so do snakes
  for (const o of Game.entities) {
    if (!o.alive || o === e) continue;
    if (dist2(o.x, o.y, e.x, e.y) > CONFIG.SQUEAK_RADIUS * CONFIG.SQUEAK_RADIUS) continue;
    o.heard = { x: e.x, y: e.y, t: 6, who: e };
  }
  if (e.isPlayer) vibrate(20);
}

/* --------------------------- 7. PERCEPTION -------------------------- */
function sightRange(e) {
  if (e.kind === 'snake') return World.isNight() ? CONFIG.PIT_ORGAN_RANGE : 640;
  return World.isNight() ? 300 : 540;             // night shrinks a mouse's world
}
// Can `o` actually perceive `t` right now? Bushes hide, stillness hides, heat reveals.
function canSee(o, t) {
  const rng = sightRange(o);
  const d2 = dist2(o.x, o.y, t.x, t.y);
  if (d2 > rng * rng) return false;
  if (t.burrow) return false;
  if (t.inBush) {
    // Pit organ: at night a snake sees the warm body of a mouse through the leaves.
    if (o.kind === 'snake' && t.kind === 'mouse' && World.isNight()) return true;
    return (t.speedNow || 0) > baseSpeed(t) * 0.45;
  }
  if (t.kind === 'snake' && t.ambush) return false;   // a coiled snake is simply not there
  return true;
}
// Ground vibration: any fast mover is felt, even through a bush. A still snake is not.
function feelsVibration(mouse, t) {
  if (t.burrow) return false;
  if ((t.speedNow || 0) < baseSpeed(t) * 0.5) return false;
  return dist2(mouse.x, mouse.y, t.x, t.y) < CONFIG.VIBRATION_RADIUS * CONFIG.VIBRATION_RADIUS;
}

/* ------------------------------- 8. AI ------------------------------ */
function aiSnake(e, dt) {
  e.stateT += dt;
  if (e.biteCd > 0) e.biteCd -= dt;
  const hungry = e.lastMeal > 16;                  // a fed snake lies in wait; a hungry one hunts
  const near = World.entGrid.query(e.x, e.y, 820, tmpB);

  let threat = null, preyBest = null, preyD = 1e9, threatD = 1e9;
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    if (o === e || !o.alive) continue;
    const d2 = dist2(e.x, e.y, o.x, o.y);
    if (o.kind === 'snake') {
      // Give way to a bigger snake only when it is actually coming for you.
      const hunting = o.target === e || o.prey === e;   // aimed at YOU, not at some mouse
      if (o.mass >= e.mass * CONFIG.SNAKE_CATCH_RATIO && (hunting || d2 < 170 * 170)
          && d2 < 330 * 330 && canSee(e, o)) { if (d2 < threatD) { threat = o; threatD = d2; } }
      else if (e.mass >= o.mass * CONFIG.SNAKE_CATCH_RATIO && canSee(e, o) && d2 < preyD) { preyBest = o; preyD = d2; }
    } else {
      if (o.mass >= e.mass * CONFIG.VENOM_RATIO) {
        // A fat mouse is only a threat if it is actually coming for you — a
        // snake that bolts from every passing mouse looks pathetic.
        const coming = o.threat === e || d2 < 150 * 150;
        if (coming && d2 < 240 * 240 && canSee(e, o)) { if (d2 < threatD) { threat = o; threatD = d2; } }
      } else {
        // Sight, plus a tongue that tastes the air: warm prey close by is
        // sensed even through the leaves, which is what makes grass dangerous.
        const smell = hungry ? 320 : 210;
        if ((canSee(e, o) || d2 < smell * smell) && d2 < preyD) { preyBest = o; preyD = d2; }
      }
    }
  }
  if (e.prey && (!e.prey.alive || e.prey.venom <= 0)) e.prey = null;
  const edible = preyBest && preyBest.mass < e.mass * CONFIG.VENOM_RATIO;

  if (threat && e.strikeT <= 0) { e.state = 'FLEE'; e.stateT = 0; e.threat = threat; }
  else if (e.digest > 0.4 && e.state !== 'FLEE') e.state = 'DIGEST';
  else if (e.prey && e.state !== 'STRIKE' && e.strikeT <= 0) e.state = 'PURSUE';
  else if (edible && e.state !== 'STRIKE' && e.state !== 'STALK' && e.strikeT <= 0) {
    // Anything worth eating, close enough to reach, is worth going after.
    const chase = hungry ? 640 : 290;
    if (preyD < chase * chase) { e.state = 'STALK'; e.stateT = 0; e.target = preyBest; }
  }

  switch (e.state) {
    case 'WANDER': {
      e.throttle = 0.45;
      if (dist2(e.x, e.y, e.wx, e.wy) < 90 * 90 || e.stateT > 6) pickWander(e, 900);
      e.desired = Math.atan2(e.wy - e.y, e.wx - e.x);
      if (e.stateT > rnd(2.5, 6)) { e.state = 'SEEK_BUSH'; e.stateT = 0; e.bushTarget = nearestBush(e.x, e.y, 1400); }
      break;
    }
    case 'SEEK_BUSH': {
      const b = e.bushTarget;
      if (!b) { e.state = 'WANDER'; e.stateT = 0; break; }
      e.desired = Math.atan2(b.y - e.y, b.x - e.x);
      const d2b = dist2(e.x, e.y, b.x, b.y);
      e.throttle = d2b < (b.r * 0.7) * (b.r * 0.7) ? 0.16 : 0.6;   // slow down, stay quiet
      if (e.inBush) { e.state = 'AMBUSH'; e.stateT = 0; e.patience = hungry ? rnd(2, 5) : rnd(3, 9); }
      else if (e.stateT > 12) { e.state = 'WANDER'; e.stateT = 0; }
      break;
    }
    case 'AMBUSH': {
      e.throttle = 0;                                   // real, patient waiting
      e.charging = e.coil > 0.4;
      const reach = 150 + e.coil * 210;
      if (preyBest && edible) {
        const tx = preyBest.x + Math.cos(preyBest.angle) * (preyBest.speedNow || 0) * 0.2;
        const ty = preyBest.y + Math.sin(preyBest.angle) * (preyBest.speedNow || 0) * 0.2;
        e.desired = Math.atan2(ty - e.y, tx - e.x);
        if (preyD < reach * reach && canStrike(e) && Math.abs(angDiff(e.angle, e.desired)) < 0.85) {
          e.strikeCharge = clamp(0.45 + e.coil, 0.45, 1);
          releaseStrike(e); e.state = 'STRIKE'; e.stateT = 0; e.target = preyBest;
        } else if (preyD > reach * reach && hungry && e.stateT > 0.6) {
          e.state = 'STALK'; e.stateT = 0; e.target = preyBest;   // creep out after it
        }
      }
      if (e.stateT > e.patience) { e.state = 'WANDER'; e.stateT = 0; e.charging = false; pickWander(e, 700); }
      break;
    }
    case 'STALK': {
      // Close the distance quietly, then lunge. This is what makes a snake
      // feel alive: it comes to you instead of waiting to be walked into.
      const p = e.target;
      if (!p || !p.alive || p.mass >= e.mass * CONFIG.VENOM_RATIO) { e.state = 'WANDER'; e.stateT = 0; e.target = null; break; }
      const d2p = dist2(e.x, e.y, p.x, p.y);
      const tx = p.x + Math.cos(p.angle) * (p.speedNow || 0) * 0.24;
      const ty = p.y + Math.sin(p.angle) * (p.speedNow || 0) * 0.24;
      e.desired = Math.atan2(ty - e.y, tx - e.x);
      const reach = 150 + e.coil * 190;
      if (d2p < reach * reach && canStrike(e) && Math.abs(angDiff(e.angle, e.desired)) < 0.6) {
        e.strikeCharge = 0.9; releaseStrike(e); e.state = 'STRIKE'; e.stateT = 0;
      } else {
        // Creep when close so the leaves stay quiet, then commit.
        e.throttle = d2p < 260 * 260 ? 0.38 : 1;
      }
      if (e.stateT > 11 || d2p > 1000 * 1000) { e.state = 'SEEK_BUSH'; e.stateT = 0; e.bushTarget = nearestBush(e.x, e.y, 900); }
      break;
    }
    case 'STRIKE': {
      e.throttle = 1;
      if (e.target && e.target.alive) e.desired = Math.atan2(e.target.y - e.y, e.target.x - e.x);
      if (e.strikeT <= 0) {
        // A miss is not the end of the hunt — go straight back after it.
        if (e.prey) { e.state = 'PURSUE'; }
        else if (e.target && e.target.alive && dist2(e.x, e.y, e.target.x, e.target.y) < 700 * 700) e.state = 'STALK';
        else { e.state = 'WANDER'; pickWander(e, 500); }
        e.stateT = 0;
      }
      break;
    }
    case 'PURSUE': {                                   // follow the envenomated prey
      const p = e.prey;
      if (!p || !p.alive) { e.prey = null; e.state = 'WANDER'; e.stateT = 0; break; }
      e.desired = Math.atan2(p.y - e.y, p.x - e.x);
      e.throttle = 0.9;
      const d2p = dist2(e.x, e.y, p.x, p.y);
      if (d2p < 180 * 180 && canStrike(e)) { e.strikeCharge = 0.8; releaseStrike(e); e.target = p; }
      if (e.stateT > 24) { e.prey = null; e.state = 'WANDER'; e.stateT = 0; }
      break;
    }
    case 'DIGEST': {                                   // heavy and vulnerable: hide
      e.throttle = e.inBush ? 0 : 0.3;
      if (!e.inBush) {
        const b = e.bushTarget || nearestBush(e.x, e.y, 900);
        e.bushTarget = b;
        if (b) e.desired = Math.atan2(b.y - e.y, b.x - e.x);
      }
      if (e.digest <= 0.1) { e.state = 'WANDER'; e.stateT = 0; }
      break;
    }
    case 'FLEE': {
      const t = e.threat;
      if (!t || !t.alive || dist2(e.x, e.y, t.x, t.y) > 520 * 520 || e.stateT > 3) { e.state = 'WANDER'; e.stateT = 0; break; }
      e.desired = Math.atan2(e.y - t.y, e.x - t.x);
      e.throttle = 1;
      break;
    }
    default: e.state = 'WANDER';
  }
  // Careless snakes sometimes break cover for no reason — the world stays alive.
  if (e.sloppy && Math.random() < dt * 0.05 && e.state === 'AMBUSH') { e.state = 'WANDER'; e.stateT = 0; }

  // A corpse is a free meal, but only worth crossing open ground for if hungry.
  if (e.digest <= 0 && hungry && e.state !== 'FLEE' && e.state !== 'STALK' && e.state !== 'STRIKE') {
    let bestC = null, bd = 520 * 520;
    for (let i = 0; i < World.corpses.length; i++) {
      const c = World.corpses[i];
      if (!c.active) continue;
      const d2c = dist2(e.x, e.y, c.x, c.y);
      if (d2c < bd) { bd = d2c; bestC = c; }
    }
    if (bestC) { e.desired = Math.atan2(bestC.y - e.y, bestC.x - e.x); e.throttle = 0.8; }
  }
}

function aiMouse(e, dt) {
  e.stateT += dt;
  if (e.heard && (e.heard.t -= dt) <= 0) e.heard = null;
  const near = World.entGrid.query(e.x, e.y, CONFIG.VIBRATION_RADIUS + 80, tmpB);

  let danger = null, dangerD = 1e9, weakSnake = null, weakD = 1e9, hurtAlly = null, allyD = 1e9, healer = null, healerD = 1e9;
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    if (o === e || !o.alive) continue;
    const d2 = dist2(e.x, e.y, o.x, o.y);
    if (o.kind === 'snake') {
      const perceived = canSee(e, o) || feelsVibration(e, o);
      if (perceived) {
        if (e.mass >= o.mass * CONFIG.VENOM_RATIO) { if (d2 < weakD) { weakSnake = o; weakD = d2; } }
        else if (d2 < dangerD) { danger = o; dangerD = d2; }
      }
    } else {
      if (o.venom > 0 && e.venom <= 0 && d2 < allyD) { hurtAlly = o; allyD = d2; }
      if (o.venom <= 0 && e.venom > 0 && d2 < healerD) { healer = o; healerD = d2; }
    }
  }
  if (e.heard && e.heard.who && e.heard.who.alive && e.heard.who.venom > 0 && e.venom <= 0) {
    const d2 = dist2(e.x, e.y, e.heard.x, e.heard.y);
    if (d2 < allyD) { hurtAlly = e.heard.who; allyD = d2; }
  }

  if (e.burrow) {                                   // underground: wait out the danger
    e.throttle = 0;
    e.state = 'BURROW';
    if (!danger && e.burrowT < CONFIG.BURROW_SAFE_TIME - 2.2) leaveBurrow(e);
    return;
  }
  if (danger && dangerD < 300 * 300) { if (e.state !== 'ATTACK_SNAKE') { e.state = 'FLEE'; e.threat = danger; e.fear = 1; } }
  else if (e.venom > 0 && e.state !== 'FLEE') e.state = 'SEEK_HEALER';
  else if (hurtAlly && e.state !== 'FLEE' && allyD < 700 * 700 && !e.sloppy) { e.state = 'HELP_ALLY'; e.ally = hurtAlly; }
  else if (weakSnake && weakD < 260 * 260 && Math.random() < 0.6) { e.state = 'ATTACK_SNAKE'; e.threat = weakSnake; }

  switch (e.state) {
    case 'FORAGE': {
      if (!e.target || !e.target.active || e.stateT > 5) { e.target = nearestSeed(e.x, e.y, 800); e.stateT = 0; }
      const s = e.target;
      if (!s) { e.throttle = 0.5; if (dist2(e.x, e.y, e.wx, e.wy) < 80 * 80) pickWander(e, 700); e.desired = Math.atan2(e.wy - e.y, e.wx - e.x); break; }
      e.desired = Math.atan2(s.y - e.y, s.x - e.x);
      const b = World.bushAt(s.x, s.y);
      if (b && !e.inBush && !e.sloppy && dist2(e.x, e.y, b.x, b.y) < (b.r + 90) * (b.r + 90)) {
        e.state = 'CAUTION'; e.stateT = 0; e.cautionT = rnd(0.6, 1.6);
      } else e.throttle = b ? 0.4 : 0.75;            // creep quietly through leaves
      break;
    }
    case 'CAUTION': {                                // stop, sniff, listen for vibrations
      e.throttle = 0;
      if (e.stateT > e.cautionT) {
        if (danger) { e.state = 'FLEE'; e.threat = danger; }
        else { e.state = 'FORAGE'; e.stateT = 0; if (Math.random() < 0.25) e.target = null; }
      }
      break;
    }
    case 'FLEE': {
      const t = e.threat;
      if (!t || !t.alive || (dist2(e.x, e.y, t.x, t.y) > 480 * 480 && e.stateT > 1.2)) { e.state = 'FORAGE'; e.stateT = 0; e.target = null; break; }
      const away = Math.atan2(e.y - t.y, e.x - t.x);
      const bur = nearestBurrow(e.x, e.y, 340);
      if (bur && e.mass <= CONFIG.BURROW_MAX_MASS) {
        e.desired = Math.atan2(bur.y - e.y, bur.x - e.x);
        if (dist2(e.x, e.y, bur.x, bur.y) < 22 * 22) enterBurrow(e, bur);
      } else e.desired = away;
      e.throttle = 1;
      if (e.squeakCd <= 0 && Math.random() < dt * 0.5) squeak(e);
      break;
    }
    case 'SEEK_HEALER': {
      if (e.venom <= 0) { e.state = 'FORAGE'; e.stateT = 0; break; }
      if (!healer) {                                 // nobody in sight: call for help
        if (e.squeakCd <= 0) squeak(e);
        if (dist2(e.x, e.y, e.wx, e.wy) < 80 * 80) pickWander(e, 600);
        e.desired = Math.atan2(e.wy - e.y, e.wx - e.x); e.throttle = 0.8; break;
      }
      e.desired = Math.atan2(healer.y - e.y, healer.x - e.x);
      e.throttle = healerD < (CONFIG.HEAL_RADIUS * 0.6) * (CONFIG.HEAL_RADIUS * 0.6) ? 0 : 0.95;
      break;
    }
    case 'HELP_ALLY': {                              // bots really do go heal each other
      const a = e.ally;
      if (!a || !a.alive || a.venom <= 0 || e.venom > 0) { e.state = 'FORAGE'; e.stateT = 0; e.ally = null; break; }
      const d2a = dist2(e.x, e.y, a.x, a.y);
      e.desired = Math.atan2(a.y - e.y, a.x - e.x);
      e.throttle = d2a < (CONFIG.HEAL_RADIUS * 0.55) * (CONFIG.HEAL_RADIUS * 0.55) ? 0 : 0.9;
      if (e.stateT > 22) { e.state = 'FORAGE'; e.stateT = 0; e.ally = null; }
      break;
    }
    case 'ATTACK_SNAKE': {
      const t = e.threat;
      if (!t || !t.alive || e.mass < t.mass * CONFIG.VENOM_RATIO || e.stateT > 9) { e.state = 'FORAGE'; e.stateT = 0; break; }
      e.desired = Math.atan2(t.y - e.y, t.x - e.x);
      e.throttle = 1;
      break;
    }
    default: e.state = 'FORAGE'; e.stateT = 0;
  }
  if (e.venom > 0 && e.squeakCd <= 0 && Math.random() < dt * 0.25) squeak(e);
}

function pickWander(e, radius) {
  const a = Math.random() * TAU, d = rnd(radius * 0.3, radius);
  e.wx = clamp(e.x + Math.cos(a) * d, 80, World.size - 80);
  e.wy = clamp(e.y + Math.sin(a) * d, 80, World.size - 80);
  e.stateT = 0;
}
function nearestBush(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (let i = 0; i < World.bushes.length; i++) {
    const b = World.bushes[i];
    const d2 = dist2(x, y, b.x, b.y);
    if (d2 < bd) { bd = d2; best = b; }
  }
  return best;
}
function nearestSeed(x, y, maxD) {
  const arr = World.seedGrid.query(x, y, maxD, tmpC);
  let best = null, bd = maxD * maxD;
  for (let i = 0; i < arr.length; i++) {
    const s = arr[i];
    if (!s.active) continue;
    const d2 = dist2(x, y, s.x, s.y) * (s.inBush ? 0.55 : 1);   // richer seeds are worth the risk
    if (d2 < bd) { bd = d2; best = s; }
  }
  return best;
}
function nearestBurrow(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (let i = 0; i < World.burrows.length; i++) {
    const b = World.burrows[i];
    if (b.occupant) continue;
    const d2 = dist2(x, y, b.x, b.y);
    if (d2 < bd) { bd = d2; best = b; }
  }
  return best;
}

/* ----------------------------- 9. CAMERA ---------------------------- */
const Camera = {
  x: CONFIG.WORLD_SIZE / 2, y: CONFIG.WORLD_SIZE / 2, zoom: 1, targetZoom: 1, shake: 0,
  follow(e, dt) {
    if (!e) return;
    const k = 1 - Math.pow(0.0015, dt);
    this.x = lerp(this.x, e.x, k);
    this.y = lerp(this.y, e.y, k);
    // Zoom out only gently with size, so growing really looks like growing.
    const base = clamp(1.20 - Math.sqrt(e.mass) * 0.026, 0.62, 1.20);
    this.targetZoom = base * (e.kind === 'snake' && e.ambush ? 1.12 : 1);
    this.zoom = lerp(this.zoom, this.targetZoom, 1 - Math.pow(0.02, dt));
    this.shake = Math.max(0, this.shake - dt * 2.6);
  },
  kick(v) { this.shake = Math.min(1.2, this.shake + v); }
};

/* ------------------------------ 10. GAME ---------------------------- */
const Game = {
  entities: [], player: null, state: 'menu', frame: 0, runTime: 0,
  lastStats: null, hintT: 0, hintIdx: 0,

  start() {
    World.generate();
    this.entities.length = 0;
    this.frame = 0; this.recycleIdx = 0;
    this.spawnPlayer();                       // the player first, then life around them
    for (let i = 0; i < CONFIG.BOT_COUNT; i++) this.spawnBot(Math.random() < CONFIG.SNAKE_BOT_SHARE);
  },

  // Bots appear in a ring around the player, so the arena is always populated
  // without ever dropping a predator straight onto their head.
  ringPoint(minD, span) {
    const p = this.player;
    if (!p) return this.findSpawnPoint(CONFIG.START_MASS);
    for (let t = 0; t < 20; t++) {
      const a = Math.random() * TAU, d = rnd(minD, minD + span);
      const x = clamp(p.x + Math.cos(a) * d, 120, World.size - 120);
      const y = clamp(p.y + Math.sin(a) * d, 120, World.size - 120);
      if (dist2(x, y, p.x, p.y) >= minD * minD) return { x, y };
    }
    return this.findSpawnPoint(CONFIG.START_MASS);
  },

  spawnBot(isSnake) {
    const q = this.ringPoint(isSnake ? 950 : 560, CONFIG.TRAFFIC_RING);
    const mass = CONFIG.START_MASS * rnd(0.7, isSnake ? 3.0 : 2.6);
    const e = isSnake ? makeSnake(q.x, q.y, mass, false) : makeMouse(q.x, q.y, mass, false);
    e.immune = 1.2;
    this.entities.push(e);
    return e;
  },

  // Anything that wanders far off the player's map is quietly brought back,
  // so the world never drains into the corners.
  recycleStragglers() {
    const p = this.player;
    if (!p || !p.alive) return;
    const ents = this.entities, R = CONFIG.RECYCLE_DIST;
    for (let k = 0; k < 6 && ents.length; k++) {
      this.recycleIdx = (this.recycleIdx + 1) % ents.length;
      const e = ents[this.recycleIdx];
      if (!e.alive || e.isPlayer || e.burrow) continue;
      if (dist2(e.x, e.y, p.x, p.y) < R * R) continue;
      const q = this.ringPoint(e.kind === 'snake' ? 950 : 560, CONFIG.TRAFFIC_RING);
      e.x = q.x; e.y = q.y;
      if (e.kind === 'snake') for (const sg of e.segs) { sg.x = q.x; sg.y = q.y; }
      e.wx = q.x; e.wy = q.y; e.target = null; e.prey = null; e.state = e.kind === 'snake' ? 'WANDER' : 'FORAGE';
    }
  },

  spawnPlayer() {
    // Each life the player is randomly a snake or a mouse — 50/50, except that
    // a run of the same role is broken: a fair coin still produces streaks of
    // seven, and being the mouse seven times running just feels broken.
    let isSnake = Math.random() < 0.5;
    if (this.roleStreak >= 2) isSnake = !this.lastRoleSnake;
    this.roleStreak = (isSnake === this.lastRoleSnake) ? this.roleStreak + 1 : 1;
    this.lastRoleSnake = isSnake;
    const p = this.findSpawnPoint(CONFIG.START_MASS, true);
    const e = isSnake ? makeSnake(p.x, p.y, CONFIG.START_MASS, true) : makeMouse(p.x, p.y, CONFIG.START_MASS, true);
    e.immune = CONFIG.SPAWN_IMMUNITY;
    this.player = e;
    this.entities.push(e);
    this.runTime = 0; this.hintT = 0; this.hintIdx = 0;
    Camera.x = e.x; Camera.y = e.y; Camera.zoom = 1;
    UI.showSpawnCard(isSnake);
  },

  // Never drop the player next to something that can eat them.
  findSpawnPoint(mass, safe) {
    for (let t = 0; t < 80; t++) {
      const x = rnd(200, World.size - 200), y = rnd(200, World.size - 200);
      let ok = true;
      for (let i = 0; i < this.entities.length; i++) {
        const o = this.entities[i];
        if (!o.alive) continue;
        const d = safe ? 900 : 520;
        if (dist2(x, y, o.x, o.y) < d * d && o.mass > mass * 1.2) { ok = false; break; }
      }
      if (ok) return { x, y };
    }
    return { x: rnd(200, World.size - 200), y: rnd(200, World.size - 200) };
  },

  step(dt) {
    World.update(dt);
    Sound.setNight(1 - World.dayFactor());
    this.runTime += dt;
    this.frame++;

    // Rebuild the entity hash once per step (cheap, no allocation).
    World.entGrid.clear();
    for (let i = 0; i < this.entities.length; i++) {
      const e = this.entities[i];
      if (e.alive) World.entGrid.insert(e);
    }

    for (let i = 0; i < this.entities.length; i++) {
      const e = this.entities[i];
      if (!e.alive) continue;
      if (e.squeakMark > 0) e.squeakMark -= dt;
      if (!e.isPlayer) {
        // Far-away bots think at a quarter rate — same behaviour, a quarter of the cost.
        const far = dist2(e.x, e.y, Camera.x, Camera.y) > 1500 * 1500;
        if (!far || ((this.frame + e.tickOff) & 3) === 0) {
          const adt = far ? dt * 4 : dt;
          if (e.kind === 'snake') aiSnake(e, adt); else aiMouse(e, adt);
        }
      }
      if (e.kind === 'snake') updateSnake(e, dt); else updateMouse(e, dt);
    }

    this.interactions(dt);
    this.healing(dt);
    this.cleanup();
    if ((this.frame & 15) === 0) this.recycleStragglers();
    Camera.follow(this.player && this.player.alive ? this.player : null, dt);
    UI.updateHints(dt);
  },

  interactions(dt) {
    const ents = this.entities;
    for (let i = 0; i < ents.length; i++) {
      const e = ents[i];
      if (!e.alive) continue;

      if (e.kind === 'mouse') {
        if (e.burrow) continue;
        // Seeds: the only food, and it grows exactly where snakes wait.
        const seeds = World.seedGrid.query(e.x, e.y, e.r + 26, tmpA);
        for (let k = 0; k < seeds.length; k++) {
          const s = seeds[k];
          if (!s.active) continue;
          if (dist2(e.x, e.y, s.x, s.y) < (e.r + 10) * (e.r + 10)) {
            s.active = false;
            setMass(e, e.mass + (s.inBush ? CONFIG.SEED_VALUE_IN_BUSH : CONFIG.SEED_VALUE));
            e.seedsEaten++;
            if (e.isPlayer) { Sound.tone(0.07, 0.09, 'triangle', 700, 980); vibrate(8); }
          }
        }
        continue;
      }

      // --- Snake head interactions ---
      if (e.biteCd > 0) e.biteCd -= dt;
      const reach = e.r + 8;
      const cand = World.entGrid.query(e.x, e.y, reach + 40, tmpA);
      for (let k = 0; k < cand.length; k++) {
        const o = cand[k];
        if (o === e || !o.alive) continue;
        const rr = reach + o.r;
        if (dist2(e.x, e.y, o.x, o.y) > rr * rr) continue;
        if (o.kind === 'mouse') {
          if (o.mass >= e.mass * CONFIG.VENOM_RATIO) { melee(e, o, dt); snakeBite(e, o); }
          else snakeBite(e, o);
        } else {
          // Snake vs snake: no collision death ever. Only a real strike catches one.
          if (e.strikeT > 0 && e.mass >= o.mass * CONFIG.SNAKE_CATCH_RATIO && o.immune <= 0 && e.immune <= 0) eatSnake(e, o);
        }
      }
      // Corpses are fair game for any snake.
      for (let k = 0; k < World.corpses.length; k++) {
        const c = World.corpses[k];
        if (!c.active) continue;
        if (dist2(e.x, e.y, c.x, c.y) < (reach + 14) * (reach + 14)) { eatCorpse(e, c); break; }
      }
    }
  },

  healing(dt) {
    const ents = this.entities;
    for (let i = 0; i < ents.length; i++) {
      const m = ents[i];
      if (!m.alive || m.kind !== 'mouse' || m.venom <= 0) continue;
      let helper = null, hd = CONFIG.HEAL_RADIUS * CONFIG.HEAL_RADIUS;
      const near = World.entGrid.query(m.x, m.y, CONFIG.HEAL_RADIUS + 20, tmpA);
      for (let k = 0; k < near.length; k++) {
        const o = near[k];
        if (o === m || !o.alive || o.kind !== 'mouse' || o.venom > 0 || o.burrow) continue;
        const d2 = dist2(m.x, m.y, o.x, o.y);
        if (d2 < hd) { hd = d2; helper = o; }
      }
      m.healPartner = helper;
      if (helper) {
        helper.helper = true;                       // the helper pays with 25% of its speed
        m.healBreak = 0;
        m.healProg += dt;
        if (Math.random() < dt * 12) World.particle(lerp(m.x, helper.x, Math.random()), lerp(m.y, helper.y, Math.random()), rnd(-8, 8), rnd(-20, -4), 0.7, rnd(1.5, 3), 3);
        if (m.healProg >= CONFIG.HEAL_TIME) {
          m.venom = 0; m.venomLayers = 0; m.healProg = 0;
          setMass(m, m.mass + 2); setMass(helper, helper.mass + 2);
          m.flash = 1; helper.flash = 1;
          const v = clamp(1 - Math.sqrt(dist2(m.x, m.y, Camera.x, Camera.y)) / 900, 0, 1);
          Sound.heal(v);
          for (let q = 0; q < 16; q++) World.particle(m.x, m.y, rnd(-90, 90), rnd(-90, 90), 0.8, rnd(2, 4), 3);
          if (m.isPlayer || helper.isPlayer) { vibrate([20, 30, 20]); Game.flashMsg('درمان شد!'); }
        }
      } else {
        m.healBreak += dt;
        if (m.healBreak > 0.4) m.healProg = 0;      // healing must be continuous
      }
    }
  },

  cleanup() {
    const ents = this.entities;
    let snakes = 0, mice = 0, bots = 0;
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i];
      if (e.alive) {
        if (!e.isPlayer) { bots++; if (e.kind === 'snake') snakes++; else mice++; }
        continue;
      }
      if (e.burrow) { e.burrow.occupant = null; e.burrow = null; }
      if (e === this.player) continue;              // the dead player stays until "again"
      ents.splice(i, 1);
    }
    while (bots < CONFIG.BOT_COUNT) {               // keep the arena populated
      const wantSnake = snakes / Math.max(1, snakes + mice) < CONFIG.SNAKE_BOT_SHARE;
      this.spawnBot(wantSnake);
      if (wantSnake) snakes++; else mice++;
      bots++;
    }
  },

  rank(e) {
    let better = 1;
    for (const o of this.entities) if (o.alive && o !== e && o.mass > e.mass) better++;
    return better;
  },
  aliveCount() { let n = 0; for (const o of this.entities) if (o.alive) n++; return n; },

  onPlayerDeath(cause) {
    const p = this.player;
    Camera.kick(0.9);
    this.lastStats = {
      mass: Math.round(p.maxMass), kills: p.kills,
      time: Math.round(this.runTime), rank: this.rank(p), cause: cause || '', kind: p.kind
    };
    setTimeout(() => { if (Game.state === 'playing') { Game.state = 'dead'; UI.showDeath(); } }, 850);
  },

  flashMsg(t) { UI.toast(t); }
};

// Melee: a mouse 2.5x heavier than the snake can genuinely win — bitterly.
function melee(snake, mouse, dt) {
  if (snake.immune > 0 || mouse.immune > 0) return;
  snake.hp -= mouse.mass * CONFIG.MELEE_DPS * dt;
  mouse.hp -= snake.mass * CONFIG.MELEE_DPS * dt;
  if (Math.random() < dt * 22) {
    World.particle(lerp(snake.x, mouse.x, 0.5), lerp(snake.y, mouse.y, 0.5), rnd(-120, 120), rnd(-120, 120), 0.6, rnd(2, 4), 2);
    World.particle(lerp(snake.x, mouse.x, 0.5), lerp(snake.y, mouse.y, 0.5), rnd(-90, 90), rnd(-90, 90), 0.8, rnd(1.5, 3), 4);
  }
  if (snake.isPlayer || mouse.isPlayer) { Camera.kick(dt * 2.2); if (Math.random() < dt * 5) vibrate(12); }
  if (snake.hp <= 0) {
    killEntity(snake, mouse, 'یک موش بزرگ تو را کشت');
    setMass(mouse, mouse.mass + snake.mass * 0.5);
    if (mouse.isPlayer) Game.flashMsg(mouse.venom > 0 ? 'مار مُرد — ولی تو هنوز مسمومی' : 'مار مُرد!');
  }
  if (mouse.hp <= 0) {
    killEntity(mouse, snake, 'در درگیری کشته شدی');
    if (snake.alive) setMass(snake, snake.mass + mouse.mass * 0.35);
  }
}

function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* ---------------------------- 11. RENDERER -------------------------- */
const R = {
  canvas: null, ctx: null, w: 0, h: 0, dpr: 1, dprScale: 1, frameAvg: 0.016, tuneT: 0,
  sandTile: null, sandPat: null, miniBase: null, miniSize: 210,
  viewL: 0, viewR: 0, viewT: 0, viewB: 0,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.buildSand();
  },
  // Frame-time watchdog: if the device cannot keep up, quietly render at a
  // lower resolution instead of dropping frames. Raises it back when it can.
  autoTune(dt) {
    this.frameAvg = this.frameAvg * 0.92 + Math.min(dt, 0.2) * 0.08;
    this.tuneT -= dt;
    if (this.tuneT > 0) return;
    if (this.frameAvg > 0.024 && this.dprScale > 0.5) {
      this.dprScale = Math.max(0.5, this.dprScale - 0.16); this.tuneT = 1.2; this.resize();
    } else if (this.frameAvg < 0.0175 && this.dprScale < 1) {
      this.dprScale = Math.min(1, this.dprScale + 0.08); this.tuneT = 2.5; this.resize();
    }
  },
  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1) * this.dprScale;   // capped for performance
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.canvas.width = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
  },

  // Procedural desert floor baked once into a seamless offscreen tile:
  // sand grain, wind ripples and a cracked-earth network.
  buildSand() {
    const s = 512, c = document.createElement('canvas');
    c.width = s; c.height = s;
    const x = c.getContext('2d');
    const img = x.createImageData(s, s);
    // Bilinear wrap-blend makes the value noise perfectly seamless.
    const tileNoise = (i, j, f) => {
      const u = i / s, v = j / s;
      return vnoise(i / f, j / f) * (1 - u) * (1 - v) + vnoise((i - s) / f, j / f) * u * (1 - v)
           + vnoise(i / f, (j - s) / f) * (1 - u) * v + vnoise((i - s) / f, (j - s) / f) * u * v;
    };
    for (let j = 0; j < s; j++) {
      for (let i = 0; i < s; i++) {
        const n = tileNoise(i, j, 64) * 0.52 + tileNoise(i, j, 17) * 0.33 + Math.random() * 0.15;
        const k = (j * s + i) * 4;
        img.data[k] = 214 + n * 36;
        img.data[k + 1] = 184 + n * 34;
        img.data[k + 2] = 126 + n * 30;
        img.data[k + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);

    // Wind ripples — sine curves whose period divides the tile, so they wrap.
    x.lineCap = 'round';
    for (let k = 0; k < 11; k++) {
      const y0 = (k + 0.5) * s / 11;
      x.strokeStyle = k % 2 ? 'rgba(228,203,152,0.34)' : 'rgba(176,146,96,0.16)';
      x.lineWidth = k % 2 ? 2.6 : 1.5;
      x.beginPath();
      for (let i = 0; i <= s; i += 8) {
        const y = y0 + Math.sin(i / s * TAU * 2 + k * 1.7) * 10 + Math.sin(i / s * TAU * 5 + k) * 3.4;
        if (i === 0) x.moveTo(i, y); else x.lineTo(i, y);
      }
      x.stroke();
    }

    // Cracked earth: a jittered lattice on a torus, drawn at nine offsets so
    // the crack network continues across every tile edge.
    const N = 14, cell = s / N, pts = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++)
      pts.push({ x: (i + 0.18 + Math.random() * 0.64) * cell, y: (j + 0.18 + Math.random() * 0.64) * cell });
    const segs = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = pts[j * N + i];
      const rt = pts[j * N + (i + 1) % N], dn = pts[((j + 1) % N) * N + i];
      segs.push([a.x, a.y, rt.x + (i === N - 1 ? s : 0), rt.y]);
      segs.push([a.x, a.y, dn.x, dn.y + (j === N - 1 ? s : 0)]);
    }
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      for (let q = 0; q < segs.length; q++) {
        const g = segs[q];
        const mx = (g[0] + g[2]) / 2 + (Math.random() - 0.5) * 7;
        const my = (g[1] + g[3]) / 2 + (Math.random() - 0.5) * 7;
        x.strokeStyle = 'rgba(234,212,166,0.20)';     // raised lip beside the crack
        x.lineWidth = 1.8;
        x.beginPath();
        x.moveTo(g[0] + ox * s + 1.3, g[1] + oy * s + 1.3);
        x.quadraticCurveTo(mx + ox * s + 1.3, my + oy * s + 1.3, g[2] + ox * s + 1.3, g[3] + oy * s + 1.3);
        x.stroke();
        x.strokeStyle = 'rgba(126,100,60,0.20)';      // the crack itself
        x.lineWidth = 1.1;
        x.beginPath();
        x.moveTo(g[0] + ox * s, g[1] + oy * s);
        x.quadraticCurveTo(mx + ox * s, my + oy * s, g[2] + ox * s, g[3] + oy * s);
        x.stroke();
      }
    }
    this.sandTile = c;
    this.sandPat = this.ctx.createPattern(c, 'repeat');
  },

  // ---- Tussock sprites: the building blocks every bush is made of ----
  buildBushSprites() {
    const px = [128, 224];                        // small clump, larger clump
    this.patchSprites = [[], []];
    for (let sc = 0; sc < 2; sc++) {
      const green = [], dry = [];
      for (let v = 0; v < 4; v++) { green.push(this.paintGreenPatch(px[sc])); dry.push(this.paintDryPatch(px[sc])); }
      this.patchSprites[0].push(green);
      this.patchSprites[1].push(dry);
    }
    // Hand the finished plants to the compositor as immutable bitmaps: a live
    // <canvas> source can be re-uploaded to the GPU on every single draw,
    // an ImageBitmap is uploaded once and then simply blitted.
    if (window.createImageBitmap) {
      for (let sp = 0; sp < 2; sp++) for (let sc = 0; sc < 2; sc++) for (let v = 0; v < 4; v++) {
        const src = this.patchSprites[sp][sc][v];
        createImageBitmap(src).then(bm => { this.patchSprites[sp][sc][v] = bm; }).catch(() => {});
      }
    }
  },

  // An irregular outline — a plant is never a perfect disc.
  crownShape() {
    const p1 = Math.random() * TAU, p2 = Math.random() * TAU, p3 = Math.random() * TAU;
    return a => 1 + 0.20 * Math.sin(3 * a + p1) + 0.13 * Math.sin(5 * a + p2) + 0.08 * Math.sin(8 * a + p3);
  },

  // A small green tussock: a handful of leafy shoots over a dark base.
  paintGreenPatch(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const x = c.getContext('2d');
    const C = size / 2, R = size * 0.42, edge = this.crownShape();
    const leaf = (px2, py, lr, r0, g0, b0, alpha) => {
      x.fillStyle = 'rgba(' + r0 + ',' + g0 + ',' + b0 + ',' + alpha + ')';
      x.beginPath();
      x.ellipse(px2, py, lr, lr * rnd(0.55, 0.8), Math.random() * TAU, 0, TAU);
      x.fill();
    };
    for (let i = 0; i < Math.round(size * 0.26); i++) {          // shadowed base
      const a = Math.random() * TAU, d = Math.pow(Math.random(), 0.5) * R * edge(a) * 0.92;
      leaf(C + Math.cos(a) * d, C + Math.sin(a) * d * 0.95, size * rnd(0.07, 0.12), 38, 50, 26, 0.9);
    }
    for (let i = 0; i < Math.round(size * 1.05); i++) {          // the foliage itself
      const a = Math.random() * TAU, d = Math.pow(Math.random(), 0.55) * R * edge(a);
      const px2 = C + Math.cos(a) * d, py = C + Math.sin(a) * d * 0.95;
      const light = clamp(1.15 - (px2 + py) / (size * 1.25), 0, 1);
      const t = Math.random() * 0.45 + light * 0.55;
      leaf(px2, py, size * rnd(0.030, 0.055), (60 + t * 66) | 0, (84 + t * 66) | 0, (34 + t * 30) | 0, 0.94);
    }
    for (let i = 0; i < Math.round(size * 0.22); i++) {          // sunlit tips
      const a = rnd(Math.PI * 0.7, Math.PI * 1.9), d = R * edge(a) * rnd(0.4, 1);
      leaf(C + Math.cos(a) * d, C + Math.sin(a) * d * 0.95, size * rnd(0.022, 0.04), 172, 190, 110, 0.8);
    }
    x.strokeStyle = 'rgba(70,58,32,0.5)'; x.lineWidth = Math.max(1, size * 0.012); x.lineCap = 'round';
    for (let i = 0; i < 5; i++) {                                 // woody stems
      const a = Math.random() * TAU, d = R * edge(a) * rnd(0.55, 0.9);
      x.beginPath(); x.moveTo(C, C + R * 0.12);
      x.quadraticCurveTo(C + Math.cos(a) * d * 0.5, C + Math.sin(a) * d * 0.4,
                         C + Math.cos(a) * d, C + Math.sin(a) * d * 0.95);
      x.stroke();
    }
    return c;
  },

  // A small dry tussock: short forking twigs with a few dead leaves clinging on.
  paintDryPatch(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const x = c.getContext('2d');
    const C = size / 2, R = size * 0.42, edge = this.crownShape();
    x.lineCap = 'round';
    const branch = (x0, y0, a, len, w, depth, col) => {
      const x1 = x0 + Math.cos(a) * len, y1 = y0 + Math.sin(a) * len * 0.94;
      x.strokeStyle = col; x.lineWidth = w;
      x.beginPath(); x.moveTo(x0, y0);
      x.quadraticCurveTo(x0 + Math.cos(a - 0.2) * len * 0.55, y0 + Math.sin(a - 0.2) * len * 0.5, x1, y1);
      x.stroke();
      if (depth > 0) {
        const forks = rndInt(2, 3);
        for (let i = 0; i < forks; i++)
          branch(lerp(x0, x1, rnd(0.4, 0.85)), lerp(y0, y1, rnd(0.4, 0.85)),
                 a + rnd(-0.95, 0.95), len * rnd(0.4, 0.6), Math.max(size * 0.006, w * 0.6), depth - 1, col);
      }
    };
    const stem = (col, w, reach, depth) => {
      const sa = Math.random() * TAU, sd = Math.pow(Math.random(), 0.8) * R * 0.3;
      const a = sa + rnd(-0.8, 0.8);
      branch(C + Math.cos(sa) * sd, C + Math.sin(sa) * sd * 0.94, a, R * edge(a) * reach, w, depth, col);
    };
    for (let i = 0; i < Math.round(size * 0.055); i++) stem('rgba(74,60,38,0.85)', size * 0.022, rnd(0.4, 0.7), 2);
    for (let i = 0; i < Math.round(size * 0.075); i++) stem('rgba(136,116,78,0.82)', size * 0.014, rnd(0.35, 0.6), 2);
    for (let i = 0; i < Math.round(size * 0.06); i++) stem('rgba(176,156,112,0.7)', size * 0.009, rnd(0.25, 0.45), 1);
    for (let i = 0; i < Math.round(size * 1.1); i++) {            // dead leaves and husks
      const a = Math.random() * TAU, d = (0.2 + Math.pow(Math.random(), 0.8) * 0.8) * R * edge(a);
      const t = Math.random();
      x.fillStyle = t < 0.46 ? 'rgba(128,110,72,0.85)' : (t < 0.8 ? 'rgba(166,146,102,0.8)' : 'rgba(106,110,64,0.8)');
      const lr = size * rnd(0.018, 0.038);
      x.beginPath();
      x.ellipse(C + Math.cos(a) * d, C + Math.sin(a) * d * 0.94, lr, lr * 0.5, a, 0, TAU);
      x.fill();
    }
    for (let i = 0; i < Math.round(size * 0.18); i++) {           // shadowed heart
      const a = Math.random() * TAU, d = Math.pow(Math.random(), 1.5) * R * 0.5;
      x.fillStyle = 'rgba(68,58,36,0.45)';
      const lr = size * rnd(0.05, 0.1);
      x.beginPath(); x.ellipse(C + Math.cos(a) * d, C + Math.sin(a) * d * 0.94, lr, lr * 0.62, a, 0, TAU); x.fill();
    }
    return c;
  },

  buildMinimap() {
    const s = 256, c = document.createElement('canvas');
    c.width = s; c.height = s;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(60,48,28,0.95)';
    x.fillRect(0, 0, s, s);
    const k = s / World.size;
    for (const b of World.bushes) {
      x.fillStyle = b.species === 0 ? 'rgba(64,104,46,0.95)' : 'rgba(104,92,58,0.95)';
      x.beginPath(); x.arc(b.x * k, b.y * k, Math.max(1.2, b.r * k), 0, TAU); x.fill();
    }
    this.miniBase = c;
  },

  frame(alpha) {
    const ctx = this.ctx;
    if (!this.patchSprites) this.buildBushSprites();
    const day = World.dayFactor();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#1a140c';
    ctx.fillRect(0, 0, this.w, this.h);

    const z = Camera.zoom;
    let sx = 0, sy = 0;
    if (Camera.shake > 0.001) { sx = rnd(-1, 1) * Camera.shake * 14; sy = rnd(-1, 1) * Camera.shake * 14; }
    ctx.save();
    ctx.translate(this.w / 2 + sx, this.h / 2 + sy);
    ctx.scale(z, z);
    ctx.translate(-Camera.x, -Camera.y);

    const hw = this.w / (2 * z) + 80, hh = this.h / (2 * z) + 80;
    this.viewL = Camera.x - hw; this.viewR = Camera.x + hw;
    this.viewT = Camera.y - hh; this.viewB = Camera.y + hh;

    this.drawGround(ctx, day);
    this.drawProps(ctx);
    this.drawTrails(ctx);
    this.drawBurrows(ctx);
    this.drawSeeds(ctx);
    this.drawCorpses(ctx);
    this.drawWaves(ctx);
    this.drawEntities(ctx, day);
    this.drawBushes(ctx, day);
    this.drawPlayerOverBush(ctx, day);
    this.drawParticles(ctx);
    this.drawHealLinks(ctx);
    ctx.restore();

    this.drawNight(ctx, day);
    this.drawHUD(ctx);
  },

  inView(x, y, r) { return x + r > this.viewL && x - r < this.viewR && y + r > this.viewT && y - r < this.viewB; },

  drawGround(ctx, day) {
    ctx.fillStyle = this.sandPat;
    ctx.fillRect(this.viewL, this.viewT, this.viewR - this.viewL, this.viewB - this.viewT);
    // Warm daylight / cold moonlight wash straight over the sand.
    ctx.fillStyle = day > 0.5
      ? 'rgba(255,214,140,' + (0.10 * day).toFixed(3) + ')'
      : 'rgba(40,58,120,' + (0.26 * (1 - day)).toFixed(3) + ')';
    ctx.fillRect(this.viewL, this.viewT, this.viewR - this.viewL, this.viewB - this.viewT);
    // Impassable rocky rim of the closed map, drawn as a run of boulders.
    const S = World.size, M = 34;
    ctx.fillStyle = '#3c3020';
    if (this.viewL < M) ctx.fillRect(this.viewL, this.viewT, M - this.viewL, this.viewB - this.viewT);
    if (this.viewR > S - M) ctx.fillRect(S - M, this.viewT, this.viewR - (S - M), this.viewB - this.viewT);
    if (this.viewT < M) ctx.fillRect(this.viewL, this.viewT, this.viewR - this.viewL, M - this.viewT);
    if (this.viewB > S - M) ctx.fillRect(this.viewL, S - M, this.viewR - this.viewL, this.viewB - (S - M));
    const rim = (along, horizontal, dir) => {
      const a0 = Math.max(-1, Math.floor((horizontal ? this.viewL : this.viewT) / 44) - 1);
      const a1 = Math.ceil((horizontal ? this.viewR : this.viewB) / 44) + 1;
      for (let row = 1; row >= 0; row--) {                 // back row first
        for (let i = a0; i <= a1; i++) {
          const j = hash2(i, (horizontal ? 7 : 13) + row * 31);
          const k = hash2(i * 3 + 1, (horizontal ? 5 : 11) + row * 17);
          const pos = i * 44 + j * 20 + row * 22;
          const r = 19 + k * 19 + row * 4;
          const off = along + dir * (row * 17 + (j - 0.5) * 12);
          const cx = horizontal ? pos : off, cy = horizontal ? off : pos;
          ctx.fillStyle = 'rgba(38,28,16,0.4)';             // contact shadow
          ctx.beginPath(); ctx.ellipse(cx + r * 0.2, cy + r * 0.24, r * 1.02, r * 0.72, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = 'rgb(' + ((128 + k * 34 - row * 22) | 0) + ',' + ((102 + k * 30 - row * 18) | 0) + ',' + ((74 + k * 26 - row * 14) | 0) + ')';
